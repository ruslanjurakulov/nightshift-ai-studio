# Nightshift on one server: the Command Center behind Caddy.
# Step by step (Uzbek): docs/DEPLOY_AX42.md
#
# Run from the repository checkout, pointing compose at the env file that lives
# OUTSIDE the checkout (so `git pull` can never overwrite or commit it):
#
#   docker compose --env-file /opt/nightshift/.env.web \
#     -f deploy/docker-compose.yml up -d --build
#
# The env file is read twice, for two different things:
#   * --env-file  -> interpolation of ${...} below. Only DOMAIN, ACME_EMAIL and
#     the NEXT_PUBLIC_* values are referenced, so only those reach Caddy's
#     environment or the image build.
#   * env_file:   -> the web container's runtime environment (server-only
#     values such as GITHUB_SECRETS_TOKEN). Never a build arg, never Caddy's.

name: nightshift

x-logging: &default-logging
  # Rotated, so a chatty container cannot fill the disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    build:
      context: ../command-center
      dockerfile: Dockerfile
      args:
        # Public by design: inlined into the browser bundle at build time.
        # Changing either needs `up -d --build`, not just a restart.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL in the env file}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set NEXT_PUBLIC_SUPABASE_ANON_KEY in the env file}
        # Operator details for /privacy and /terms; empty shows NOT CONFIGURED there.
        NEXT_PUBLIC_LEGAL_NAME: ${NEXT_PUBLIC_LEGAL_NAME:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_LEGAL_COUNTRY: ${NEXT_PUBLIC_LEGAL_COUNTRY:-}
        NEXT_PUBLIC_LEGAL_EFFECTIVE_DATE: ${NEXT_PUBLIC_LEGAL_EFFECTIVE_DATE:-}
        # Paddle checkout for buying credits; empty token hides it.
        NEXT_PUBLIC_PADDLE_ENV: ${NEXT_PUBLIC_PADDLE_ENV:-}
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN:-}
        NEXT_PUBLIC_PADDLE_PRICE_STARTER: ${NEXT_PUBLIC_PADDLE_PRICE_STARTER:-}
        NEXT_PUBLIC_PADDLE_PRICE_CREATOR: ${NEXT_PUBLIC_PADDLE_PRICE_CREATOR:-}
        NEXT_PUBLIC_PADDLE_PRICE_STUDIO: ${NEXT_PUBLIC_PADDLE_PRICE_STUDIO:-}
        # /pricing display prices (used until/unless Paddle's own preview answers)
        # and the credit expiry term the Terms print; empty = not shown / never.
        NEXT_PUBLIC_PRICE_DISPLAY_STARTER: ${NEXT_PUBLIC_PRICE_DISPLAY_STARTER:-}
        NEXT_PUBLIC_PRICE_DISPLAY_CREATOR: ${NEXT_PUBLIC_PRICE_DISPLAY_CREATOR:-}
        NEXT_PUBLIC_PRICE_DISPLAY_STUDIO: ${NEXT_PUBLIC_PRICE_DISPLAY_STUDIO:-}
        NEXT_PUBLIC_PADDLE_PLAN_CREATOR: ${NEXT_PUBLIC_PADDLE_PLAN_CREATOR:-}
        NEXT_PUBLIC_PADDLE_PLAN_PRO: ${NEXT_PUBLIC_PADDLE_PLAN_PRO:-}
        NEXT_PUBLIC_PADDLE_PLAN_STUDIO: ${NEXT_PUBLIC_PADDLE_PLAN_STUDIO:-}
        NEXT_PUBLIC_PLAN_DISPLAY_CREATOR: ${NEXT_PUBLIC_PLAN_DISPLAY_CREATOR:-}
        NEXT_PUBLIC_PLAN_DISPLAY_PRO: ${NEXT_PUBLIC_PLAN_DISPLAY_PRO:-}
        NEXT_PUBLIC_PLAN_DISPLAY_STUDIO: ${NEXT_PUBLIC_PLAN_DISPLAY_STUDIO:-}
        NEXT_PUBLIC_CREDITS_EXPIRY_MONTHS: ${NEXT_PUBLIC_CREDITS_EXPIRY_MONTHS:-}
    image: nightshift-web:latest
    restart: unless-stopped
    env_file:
      - ${WEB_ENV_FILE:-/opt/nightshift/.env.web}
    environment:
      # The origin the browser uses. Behind a proxy the standalone server cannot
      # see it (it reports its bind address), and the YouTube OAuth redirect_uri
      # is built from it — see command-center/lib/server/public-origin.ts.
      APP_ORIGIN: https://${DOMAIN:?set DOMAIN in the env file}
      # Paid 720p / 1080p downloads (migration 0030): the worker writes
      # <id>.mp4 here and /api/downloads/<id> streams it after an RLS check.
      # Read-only: the dashboard never writes or deletes a download.
      NIGHTSHIFT_DOWNLOADS_DIR: /data/downloads
      # Media library (migration 0038): masters, thumbnails and proxies the
      # media-worker wrote, served read-only through short-lived signed links
      # (MEDIA_URL_SECRET, in the env file) — and the staging directory the
      # upload route streams bodies into, the one place this container writes.
      NIGHTSHIFT_MEDIA_DIR: /data/media
      NIGHTSHIFT_MEDIA_STAGING_DIR: /data/media-staging
    # No `ports:` on purpose. Docker publishes ports around ufw, so a published
    # 3000 would be open to the internet whatever the firewall says. Caddy
    # reaches the app over the compose network instead.
    expose:
      - "3000"
    init: true
    read_only: true
    volumes:
      # The worker's prepared downloads only — not its output/ (scripts,
      # checkpoints, masters). An empty volume while the worker is off.
      - worker_downloads:/data/downloads:ro
      # The library's files: written by media-worker only.
      - media:/data/media:ro
      # Uploads land here as <ticket uuid>.upload and wait for media-worker,
      # which checks the content before anything is stored or served.
      - media_staging:/data/media-staging
    tmpfs:
      - /tmp
      # Next's runtime cache; uid 1000 is the image's `node` user.
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Headroom for the worker: the dashboard must never be what starves a
    # render of memory.
    mem_limit: 2g
    logging: *default-logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in the env file}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in the env file}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account. Losing this means re-issuing, and
      # re-issuing too often hits Let's Encrypt rate limits — back it up.
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

  # ── Pipeline worker (docs/DEPLOY_AX42.md, "Worker"; docs/WORKER_VPS.md) ────
  # tools/queue_worker.py: claims render_jobs rows ("Run now" with
  # NIGHTSHIFT_RUN_BACKEND=queue) and runs them. Behind the `worker` profile:
  # deploy/remote-deploy.sh starts it only while the GitHub variable
  # NIGHTSHIFT_WORKER is `on`, and removes it otherwise.
  #
  # Its env file is its own. It holds the bot's keys and the Supabase service
  # key, and is written from GitHub on every deploy; .env.web, which the
  # dashboard reads, never carries any of them. No port: it only calls out.
  worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: Dockerfile.worker
    image: nightshift-worker:latest
    restart: unless-stopped
    env_file:
      # required: false — with the worker off the file does not exist, and
      # compose still parses this service because the profile is named.
      - path: ${WORKER_ENV_FILE:-/opt/nightshift/.env.worker}
        required: false
    environment:
      NIGHTSHIFT_WORKER_ID: nightshift-01
      # On `docker stop` (a deploy, a reboot) the running video gets this long
      # to finish; after that it is stopped, re-queued, and resumed from its
      # checkpoint, so nothing already paid for is bought again. Kept under
      # stop_grace_period so the worker releases the job itself.
      WORKER_STOP_GRACE_SECONDS: "840"
      # Paid downloads (migration 0030): prepared files, shared read-only
      # with the web service. Files expire after 24 hours.
      NIGHTSHIFT_DOWNLOADS_DIR: /app/downloads
    stop_grace_period: 15m
    volumes:
      # Run checkpoints, resume ledgers and renders; topic memory; logs.
      - worker_output:/app/output
      - worker_history:/app/history
      - worker_logs:/app/logs
      - worker_downloads:/app/downloads
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A render uses every core it is given; half the default weight means the
    # dashboard still answers while one runs.
    cpu_shares: 512
    mem_limit: 48g
    logging: *default-logging

  # ── Media library ingest (migration 0038, tools/media_worker.py) ─────────
  # Same image as the worker, its own process: an upload is checked (content
  # sniffed, ffprobed, thumbnail / proxy made) within seconds instead of
  # waiting behind a 30-minute render. Started and removed with the worker.
  #
  # uid 1000 is the web image's `node` user: the web container writes staged
  # uploads and this service reads and deletes them, so both run as the same
  # uid instead of sharing a world-writable directory.
  media-worker:
    profiles: ["worker"]
    image: nightshift-worker:latest
    restart: unless-stopped
    command: ["python", "tools/media_worker.py"]
    user: "1000:1000"
    env_file:
      - path: ${WORKER_ENV_FILE:-/opt/nightshift/.env.worker}
        required: false
    environment:
      NIGHTSHIFT_WORKER_ID: nightshift-media-01
      NIGHTSHIFT_MEDIA_DIR: /app/media
      NIGHTSHIFT_MEDIA_STAGING_DIR: /app/media-staging
      HOME: /tmp
    stop_grace_period: 2m
    volumes:
      - media:/app/media
      - media_staging:/app/media-staging
    tmpfs:
      - /tmp
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpu_shares: 512
    mem_limit: 4g
    logging: *default-logging

  # ── Creative worker (migration 0036, tools/creative_worker.py) ─────────────
  # Runs creative_jobs — image / video / speech generations started from the
  # Command Center — in its own process, so a generation never waits behind a
  # pipeline render. Same image and env file as the pipeline worker (the
  # provider keys and the Supabase service key live only there). Started by
  # hand once 0036 is applied:
  #   docker compose --profile worker -f deploy/docker-compose.yml up -d creative-worker
  # A deploy recreates it only if it is already running, and removes it with
  # the pipeline worker when the worker is switched off.
  #
  # Migration 0046: it reads the source picture of an edit / image-to-video /
  # upscale / background-removal job from the media library, and adds every
  # output to the organization's library. So it shares the `media` volume
  # with media-worker, and runs as the same uid (1000), which owns it. A job's
  # scratch folder lives on that volume too (same filesystem: the finished
  # file is moved into place, never half-copied); the web container serves
  # only id-derived paths, never this folder. Provider adapters are switched
  # on by NIGHTSHIFT_CREATIVE_ADAPTERS below; without it nothing is claimed.
  creative-worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: Dockerfile.worker
    image: nightshift-worker:latest
    command: ["python", "tools/creative_worker.py"]
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - path: ${WORKER_ENV_FILE:-/opt/nightshift/.env.worker}
        required: false
    environment:
      NIGHTSHIFT_WORKER_ID: nightshift-creative-01
      # The provider adapters (modules/creative_adapters.py). Set here, not in
      # the env file, so a deploy never starts a worker that claims nothing.
      NIGHTSHIFT_CREATIVE_ADAPTERS: modules.creative_adapters:resolve
      NIGHTSHIFT_MEDIA_DIR: /app/media
      # One scratch folder per job id; emptied once the outputs are library
      # assets.
      NIGHTSHIFT_CREATIVE_DIR: /app/media/.creative-jobs
      # Provider jobs mostly wait on the provider; this many run at once.
      CREATIVE_WORKER_CONCURRENCY: "4"
      HOME: /tmp
    # A job waiting on its provider is handed back on stop with its task id
    # stored, and polled again on the next start — never paid for twice.
    stop_grace_period: 1m
    volumes:
      - media:/app/media
    tmpfs:
      - /tmp
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpu_shares: 256
    mem_limit: 2g
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
  worker_output:
  worker_history:
  worker_logs:
  worker_downloads:
  # The media library (0038). NOT a backup: RAID1 survives a disk, not a
  # deletion or the server; an off-site copy is a later step.
  media:
  media_staging:
