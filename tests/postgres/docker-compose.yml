services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nightshift_test
      POSTGRES_PASSWORD: nightshift_test_only
      POSTGRES_DB: nightshift_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightshift_test -d nightshift_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data


