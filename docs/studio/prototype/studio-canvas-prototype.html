<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nightshift Studio · canvas prototype</title>
<meta name="description" content="Prototype with mock data: every creative tool of Nightshift as nodes on one canvas, with a timeline view of the same project.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Nightshift Studio, canvas prototype. Mock data throughout.
   Visual language from research/film-design.md ("2200"): violet = the machine is working,
   amber = a person's mark (selection, the playhead, the camera you place, approval).
   Light is emitted only by real state. Fixed chrome is layout, never laid over the work. */
:root {
  --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --violet-a: #5546d1; --violet-b: #8236c8;
  --grad: linear-gradient(135deg, var(--violet-a), var(--violet-b));
  --beam: linear-gradient(90deg, #5546d1, #a67bff 40%, #5ee7ff 60%, #8236c8);
  --ease: cubic-bezier(0.2, 0, 0, 1); --ease-exit: cubic-bezier(0.4, 0, 1, 1);
  --d-tap: 120ms; --d-state: 200ms; --d-enter: 320ms; --d-scene: 560ms;
  --rail-w: 76px; --insp-w: 404px; --drawer-w: 300px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #07060c; --canvas: #0b0a12; --console: #12101a; --raise: #1a1724; --key: #1f1c2a; --key-hi: #292536;
  --rule: rgb(255 255 255 / 0.09); --rule-strong: #6d6780;
  --text: #f3efe8; --dim: #b7b0c2; --faint: #9a93a8;
  --violet-ink: #c9b8ff; --violet-soft: rgb(130 54 200 / 0.18); --violet-light: rgb(140 90 255 / 0.55);
  --amber: #ffb547; --amber-ink: #ffbe5e; --on-amber: #1a1105; --amber-soft: rgb(255 181 71 / 0.16); --amber-light: rgb(255 181 71 / 0.45);
  --go: #5fd49a; --tally: #ff6e5e; --caution: #f3d36b; --tally-soft: rgb(255 110 94 / 0.12);
  --focus: #ffc266; --film: #04040a; --lamp-off: #6d6780; --scrim: rgb(4 3 10 / 0.66);
  --p-text: #a9b4c8; --p-image: #5ee7ff; --p-video: #ff7ab6; --p-audio: #5fd49a; --p-ref: #8fb8ff;
  --dot: rgb(255 255 255 / 0.10);
  --node-bg: linear-gradient(165deg, #1a1724, #14121d 60%);
  --glass: rgb(18 16 26 / 0.86);
  --nebula: radial-gradient(1100px 620px at 12% -12%, rgb(85 70 209 / 0.30), transparent 62%),
            radial-gradient(900px 520px at 96% -6%, rgb(130 54 200 / 0.22), transparent 60%),
            radial-gradient(1200px 520px at 55% 118%, rgb(255 160 70 / 0.08), transparent 62%);
  --lift-1: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 20px -10px rgb(0 0 0 / 0.7);
  --lift-2: 0 2px 4px rgb(0 0 0 / 0.45), 0 22px 44px -18px rgb(0 0 0 / 0.9);
  --lift-3: 0 0 0 1px rgb(255 255 255 / 0.05), 0 30px 70px -20px rgb(0 0 0 / 0.9);
}
:root[data-theme="light"] {
  color-scheme: light;
  --ground: #f3f2f7; --canvas: #f6f5fa; --console: #ffffff; --raise: #fbfaff; --key: #eeecf4; --key-hi: #e4e1ee;
  --rule: rgb(30 24 60 / 0.12); --rule-strong: #85809a;
  --text: #17141f; --dim: #514b5f; --faint: #5f596d;
  --violet-ink: #5232b8; --violet-soft: rgb(85 70 209 / 0.10); --violet-light: rgb(120 70 230 / 0.32);
  --amber: #f29a1e; --amber-ink: #9c5300; --on-amber: #1b1a17; --amber-soft: rgb(242 154 30 / 0.16); --amber-light: rgb(242 154 30 / 0.38);
  --go: #0a7346; --tally: #b9341f; --caution: #7e6100; --tally-soft: rgb(185 52 31 / 0.08);
  --focus: #a85a00; --film: #04040a; --lamp-off: #a29db2; --scrim: rgb(23 20 31 / 0.4);
  --p-text: #4d586b; --p-image: #0a7fa0; --p-video: #c02a6e; --p-audio: #0a7346; --p-ref: #2a5bd7;
  --dot: rgb(30 24 60 / 0.13);
  --node-bg: linear-gradient(165deg, #ffffff, #fbfaff 60%);
  --glass: rgb(255 255 255 / 0.9);
  --nebula: radial-gradient(1000px 560px at 10% -10%, rgb(110 90 240 / 0.14), transparent 62%),
            radial-gradient(900px 520px at 100% 0%, rgb(170 90 230 / 0.10), transparent 60%),
            radial-gradient(1100px 520px at 55% 120%, rgb(255 170 80 / 0.12), transparent 62%);
  --lift-1: 0 1px 2px rgb(30 24 60 / 0.06), 0 6px 16px -8px rgb(30 24 60 / 0.18);
  --lift-2: 0 2px 4px rgb(30 24 60 / 0.07), 0 18px 36px -16px rgb(30 24 60 / 0.32);
  --lift-3: 0 1px 2px rgb(30 24 60 / 0.06), 0 26px 60px -18px rgb(30 24 60 / 0.34);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); font-size: 14px; line-height: 1.45; color: var(--text); background: var(--nebula), var(--ground);
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.s { width: 16px; height: 16px; }
.skip { position: fixed; left: 8px; top: -60px; z-index: 99; background: var(--console); padding: 10px 14px; border-radius: 10px; }
.skip:focus { top: 8px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); height: 100dvh; }
.rail { display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 12px 6px; border-right: 1px solid var(--rule); background: color-mix(in srgb, var(--console) 70%, transparent); }
.logo { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 12px; background: var(--grad); color: #fff; font-weight: 600; font-size: 20px; }
.rail a, .rail button.ri { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px; border-radius: 12px; color: var(--dim); text-decoration: none; font-size: 13px; border: 0; background: none; position: relative; }
.rail a:hover, .rail button.ri:hover { background: var(--key); color: var(--text); }
.rail a[aria-current="page"] { color: var(--text); background: var(--key); }
.rail a[aria-current="page"]::before { content: ""; position: absolute; left: -6px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--amber); }
.rail .sp { flex: 1; }
.rail .grp { font-size: 13px; color: var(--faint); text-align: center; margin-top: 8px; border-top: 1px solid var(--rule); padding-top: 8px; }
.main { display: grid; grid-template-rows: 60px auto minmax(0, 1fr) auto 60px; grid-template-areas: "bar" "strip" "work" "tl" "deck"; min-width: 0; min-height: 0; }
.pbar { grid-area: bar; } .strip { grid-area: strip; } .work { grid-area: work; } .tl { grid-area: tl; } .deck { grid-area: deck; }
.pbar { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--rule); min-width: 0; }
.pswitch { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 6px 10px; border-radius: 12px; border: 1px solid transparent; background: none; text-align: left; }
.pswitch:hover { background: var(--key); }
.pswitch .nm, .pswitch .kd { display: block; }
.pswitch .nm { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pswitch .kd { font-size: 13px; color: var(--dim); white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; font-size: 13px; font-weight: 500; border: 1px solid var(--rule); background: var(--key); color: var(--dim); white-space: nowrap; }
.chip.mock::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(135deg, #a67bff, #5ee7ff); }
.chip.auto { color: var(--violet-ink); border-color: var(--violet-light); background: var(--violet-soft); }
.chip.human { color: var(--amber-ink); border-color: var(--amber-light); background: var(--amber-soft); }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--key); border: 1px solid var(--rule); }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"] { background: var(--console); color: var(--text); box-shadow: var(--lift-1); }
.grow { flex: 1; min-width: 0; }
.kbtn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--rule); background: var(--key); color: var(--text); font-size: 14px; font-weight: 500; white-space: nowrap; }
.kbtn:hover { background: var(--key-hi); }
.kbtn kbd, kbd { font: 500 13px var(--font); padding: 1px 6px; border-radius: 6px; border: 1px solid var(--rule-strong); color: var(--dim); }
.kbtn.icon { width: 38px; padding: 0; justify-content: center; }
.kbtn.primary { background: var(--grad); color: #fff; border-color: transparent; }
.kbtn.primary:disabled { background: var(--key); color: var(--faint); border-color: var(--rule); cursor: not-allowed; }
.kbtn.human { background: var(--amber); color: var(--on-amber); border-color: transparent; }
.kbtn.human:disabled { background: var(--key); color: var(--faint); border-color: var(--rule); cursor: not-allowed; }
.kbtn:disabled { cursor: not-allowed; opacity: .9; }
.kbtn.primary:focus-visible, .kbtn.human:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--ground), 0 0 0 4px var(--focus); }
.kbtn .sep { width: 1px; height: 18px; background: rgb(255 255 255 / .35); }
.credits { font-size: 14px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.credits small { font-weight: 500; color: var(--dim); font-size: 13px; }

/* project strip (status of real state; a row, never over the canvas) */
.strip { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--rule); font-size: 14px; color: var(--dim); min-width: 0; }
.strip b { color: var(--text); font-weight: 600; }
.strip.autop { background: linear-gradient(90deg, var(--amber-soft), transparent 70%); }
.strip .msg { flex: 1 1 380px; min-width: 0; }
.tally { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }

.work { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
.drawer { grid-column: 1; } .insp { grid-column: 3; }
.stage { grid-column: 2; grid-row: 1; position: relative; overflow: hidden; min-width: 0; background: var(--canvas); --busy: 0; }
.stage::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 220px; pointer-events: none; z-index: 1;
  background: radial-gradient(60% 100% at 50% 0%, var(--violet-light), transparent 70%); opacity: calc(var(--busy) * 0.5); transition: opacity var(--d-scene) var(--ease); }
.vp { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: default; outline: none;
  background-image: radial-gradient(circle, var(--dot) 1.2px, transparent 1.6px); background-size: var(--gs, 24px) var(--gs, 24px); background-position: var(--gx, 0) var(--gy, 0); }
.vp:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
.vp.hand, .vp.panning { cursor: grab; } .vp.panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; --inv: 1; }
svg.edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
svg.edges path.e { fill: none; stroke-width: calc(2px * min(var(--inv), 2.2)); opacity: .6; }
svg.edges path.hit { fill: none; stroke: transparent; stroke-width: 14px; pointer-events: stroke; cursor: pointer; }
svg.edges path.e.sel { stroke: var(--amber) !important; opacity: 1; }
svg.edges path.e.hl { opacity: 1; }
svg.edges path.flow { fill: none; stroke: #b9a3ff; stroke-width: calc(2.6px * min(var(--inv), 2.2)); stroke-dasharray: 6 12; filter: drop-shadow(0 0 4px #8c5aff); animation: flow 0.9s linear infinite; }
:root[data-theme="light"] svg.edges path.flow { stroke: #6a45e0; filter: drop-shadow(0 0 3px rgb(106 69 224 / .5)); }
@keyframes flow { to { stroke-dashoffset: -18; } }
svg.edges path.ghost { fill: none; stroke: var(--amber); stroke-width: 2px; stroke-dasharray: 4 6; }
.t-text { stroke: var(--p-text); --pc: var(--p-text); } .t-image { stroke: var(--p-image); --pc: var(--p-image); }
.t-video { stroke: var(--p-video); --pc: var(--p-video); } .t-audio { stroke: var(--p-audio); --pc: var(--p-audio); }
.t-ref { stroke: var(--p-ref); --pc: var(--p-ref); } .t-media { --pc: var(--p-image); }

/* nodes. All node text is >= 15px, so at the smallest detailed zoom (0.87) it renders >= 13px. Below that the canvas
   switches to its overview read (lod), where titles are scaled up by 1/zoom instead of shrinking. */
.node { position: absolute; width: var(--w); border-radius: 16px; background: var(--node-bg); border: 1px solid var(--rule); box-shadow: var(--lift-2);
  font-size: 15px; line-height: 1.35; user-select: none; touch-action: none; transition: box-shadow var(--d-state) var(--ease), border-color var(--d-state) var(--ease); }
.node:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.node.sel { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber), 0 0 0 6px var(--amber-soft), 0 0 34px -4px var(--amber-light), var(--lift-2); }
.node.working { box-shadow: 0 0 0 1px var(--violet-light), 0 26px 50px -16px var(--violet-light), var(--lift-2); }
.node.working.sel { box-shadow: 0 0 0 1px var(--amber), 0 0 0 6px var(--amber-soft), 0 26px 50px -16px var(--violet-light); }
.node.failed { border-color: color-mix(in srgb, var(--tally) 60%, transparent); }
.node.waiting { border-color: var(--amber); }
.node.dragging { box-shadow: var(--lift-3); cursor: grabbing; z-index: 5; }
.nh { display: flex; align-items: center; gap: 9px; padding: 10px 12px 8px; cursor: grab; min-width: 0; }
.ty { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--key); color: var(--dim); flex: none; }
.g-story .ty { color: var(--p-text); } .g-look .ty { color: var(--p-ref); } .g-shots .ty { color: var(--p-image); }
.g-sound .ty { color: var(--p-audio); } .g-out .ty { color: var(--p-video); } .g-note .ty { color: var(--amber-ink); }
.nt { flex: 1; min-width: 0; }
.nt .k { font-size: 15px; color: var(--dim); display: block; line-height: 1.2; }
.nt .n { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nb { padding: 0 12px 12px; }
.nb p { margin: 0 0 8px; color: var(--dim); }
.nb .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.lampw { display: inline-flex; align-items: center; gap: 7px; color: var(--dim); white-space: nowrap; }
.lamp { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--lamp-off); }
.lamp.ready { background: var(--go); box-shadow: 0 0 8px color-mix(in srgb, var(--go) 60%, transparent); }
.lamp.working { background: #a67bff; box-shadow: 0 0 10px #8c5aff; animation: breathe 1.6s ease-in-out infinite alternate; }
.lamp.failed { background: var(--tally); }
.lamp.waiting { background: transparent; border: 2px solid var(--amber); }
.lamp.draft, .lamp.idle { background: transparent; border: 2px solid var(--lamp-off); }
.lamp.unknown { background: transparent; border: 2px dashed var(--lamp-off); }
@keyframes breathe { from { opacity: .55; } to { opacity: 1; } }
.art { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--film); }
.art svg, .art .ly svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.art .ly { position: absolute; inset: 0; }
.art .ly.gray svg { filter: grayscale(1) contrast(1.05) brightness(.9); }
.art.holo .ly.base svg, .art .ly.holo svg { filter: grayscale(1) sepia(1) hue-rotate(208deg) saturate(2.6) brightness(.85); }
.art.holo::after, .art .scanl { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgb(255 255 255 / .06) 0 1px, transparent 1px 3px); pointer-events: none; }
.art .ly.top { clip-path: inset(0 calc(100% - var(--p, 0%)) 0 0); }
.art .edge { position: absolute; top: 0; bottom: 0; left: var(--p, 0%); width: 2px; background: #fff; box-shadow: 0 0 10px 2px #a67bff, 0 0 18px 4px #5ee7ff66; }
.art.failed svg { filter: grayscale(1) brightness(.55); }
.art.failed { box-shadow: inset 0 0 0 2px var(--tally); }
.art .mk { position: absolute; left: 8px; top: 8px; display: inline-flex; gap: 6px; align-items: center; height: 24px; padding: 0 9px; border-radius: 99px; font-size: 13px; font-weight: 500;
  color: #f3efe8; background: rgb(10 8 18 / .72); backdrop-filter: blur(6px); }
.art .mk::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(135deg, #a67bff, #5ee7ff); }
.art .pc { position: absolute; right: 8px; top: 8px; height: 24px; padding: 0 9px; border-radius: 99px; font-size: 13px; font-weight: 600; color: #fff; background: rgb(85 70 209 / .85); display: inline-flex; align-items: center; }
.node .art .mk, .node .art .pc { font-size: 15px; height: 26px; }
.meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 9px 0 6px; color: var(--dim); }
.meta .no { color: var(--text); font-weight: 600; }
.nchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.nchip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 3px 10px; border-radius: 9px; border: 1px solid var(--rule); background: var(--key); color: var(--text); font-size: 15px; font-weight: 500; }
button.nchip:hover { background: var(--key-hi); }
.nchip.pend { color: var(--amber-ink); border-color: var(--amber-light); }
.nfail { color: var(--tally); font-weight: 500; }
.notebody { padding: 2px 14px 14px; color: var(--text); font-size: 15px; }
.node.t-note { background: color-mix(in srgb, var(--amber) 14%, var(--console)); border-color: var(--amber-light); }
/* frames (groups) */
.frame { position: absolute; border-radius: 22px; border: 1.5px dashed var(--rule-strong); background: color-mix(in srgb, var(--console) 40%, transparent); }
.frame.sel { border-color: var(--amber); border-style: solid; }
.frame .fh { position: absolute; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 18px; font-size: 16px; font-weight: 600; cursor: grab; }
.frame .fh .k { color: var(--dim); font-weight: 500; font-size: 15px; }
/* ports: shape is the type, never colour alone */
.port { position: absolute; width: 26px; height: 26px; margin: 0; padding: 0; border: 0; background: none; display: grid; place-items: center; z-index: 2; transform: scale(min(var(--inv), 1.5)); }
.port.in { left: -13px; } .port.out { right: -13px; }
.port::before { content: ""; width: 12px; height: 12px; background: var(--pc); box-shadow: 0 0 0 3px var(--console); }
.port.s-text::before { border-radius: 2px; }
.port.s-image::before, .port.s-media::before { border-radius: 50%; }
.port.s-video::before { transform: rotate(45deg); width: 11px; height: 11px; }
.port.s-audio::before { clip-path: polygon(50% 0, 100% 100%, 0 100%); box-shadow: none; width: 14px; height: 13px; }
.port.s-ref::before { border-radius: 50%; background: var(--console); border: 3px solid var(--pc); width: 14px; height: 14px; box-shadow: none; }
.port:hover::before, .port:focus-visible::before { outline: 2px solid var(--pc); outline-offset: 3px; }
.port.armed::before { outline: 2px solid var(--amber); outline-offset: 3px; }
.world.connecting .port.in { opacity: .25; }
.world.connecting .port.in.ok { opacity: 1; }
.world.connecting .port.in.ok::before { outline: 2px solid var(--pc); outline-offset: 4px; }
.ptip { position: absolute; z-index: 30; pointer-events: none; padding: 6px 10px; border-radius: 9px; font-size: 13px; background: var(--console); border: 1px solid var(--rule); box-shadow: var(--lift-1); white-space: nowrap; }
/* overview read (zoomed out) */
.lodl { display: none; }
.world.lod .node .nh, .world.lod .node .nb > :not(.art) { visibility: hidden; }
.world.lod .node .nb > .art .mk, .world.lod .node .nb > .art .pc { visibility: hidden; }
.world.lod .lodl { display: block; position: absolute; left: 10px; right: 10px; bottom: 10px; font-size: calc(16px * var(--inv)); line-height: 1.12; font-weight: 600;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.world.lod .node.has-art .lodl { top: auto; }
.world.lod .lodl .lamp { display: inline-block; width: calc(10px * var(--inv)); height: calc(10px * var(--inv)); margin-right: calc(6px * var(--inv)); vertical-align: middle; }
.world.lod .frame .fh { font-size: calc(17px * var(--inv)); height: calc(52px * var(--inv)); transform-origin: 0 0; }
.world.lod .frame .fh .k { display: none; }

/* Semantic zoom, measured against ComfyUI's level of detail and Spaces' group ports (node-canvas-benchmark.md).
   Below 87% a box's label moves above the box, where it never covers a member. Below 62% (the overview) a node
   says what it is, scenes show their number, and lines to members of a box arrive as one bundle. */
.lodl .lo { display: none; }
.world.ov .lodl .lt { display: none; }
.world.ov .lodl .lo { display: inline; }

/* a member's lines are bundled at the box, so its ports step back; they return while a line is being drawn */
.world.ov .node.mem .port.in { visibility: hidden; }

.world.ov .node.mem .port.out { opacity: .35; }
.world.ov .node.t-scene .lodl { font-size: calc(15px * var(--inv)); }
.frame .ko { display: none; }
.world.lod .frame .fh { top: auto; bottom: 100%; height: auto; flex-wrap: wrap; align-items: baseline; row-gap: 0; column-gap: calc(8px * var(--inv)); padding: 0 calc(4px * var(--inv)) calc(8px * var(--inv)); font-size: calc(16px * var(--inv)); }
.world.lod .frame .fh .i { width: calc(18px * var(--inv)); height: calc(18px * var(--inv)); align-self: center; }

.frame .fh .ftt { white-space: nowrap; }
.frame .fh .k { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fcol { margin-left: auto; flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--rule); background: var(--key); color: var(--dim); }
.fcol:hover { background: var(--key-hi); color: var(--text); }
.fcol .i { transition: transform var(--d-state) var(--ease); }
.frame.coll .fcol .i { transform: rotate(-90deg); }
.world.lod .fcol { display: none; }
.frame.t-group { border-style: solid; border-color: color-mix(in srgb, var(--p-ref) 34%, transparent); background: color-mix(in srgb, var(--p-ref) 5%, transparent); }
.frame.t-group.sel { border-color: var(--amber); }
.node.hid { display: none; }
.fstrip { position: absolute; left: 24px; right: 24px; top: 66px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; }
.fsc { position: relative; padding: 0; border: 1px solid var(--rule); border-radius: 10px; background: var(--film); overflow: hidden; }
.fsc .art { border-radius: 0; }
.fsc .art .mk, .fsc .art .pc { display: none; }
.fsc .fno { position: absolute; left: 6px; bottom: 6px; display: inline-flex; gap: 6px; align-items: center; height: 26px; padding: 0 8px; border-radius: 8px; font-size: 15px; font-weight: 600; color: #fff; background: rgb(10 8 18 / .78); }
.fsc.failed { border-color: var(--tally); }
.fsc:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.world.lod .fsc .fno { font-size: calc(13.5px * var(--inv)); height: auto; padding: calc(2px * var(--inv)) calc(6px * var(--inv)); left: calc(4px * var(--inv)); bottom: calc(4px * var(--inv)); }
.gchips { position: absolute; left: 24px; right: 24px; top: 66px; display: flex; gap: 10px; }
.gch { width: 92px; display: grid; gap: 6px; justify-items: center; padding: 0; border: 0; background: none; color: var(--text); font-size: 15px; font-weight: 500; line-height: 1.2; text-align: center; }
.gth { position: relative; width: 80px; height: 80px; border-radius: 12px; overflow: hidden; display: grid; place-items: center; background: var(--key); border: 1px solid var(--rule); }
.gth > svg { width: 100%; height: 100%; display: block; }
.gsw { display: grid; grid-template-columns: 1fr 1fr; width: 100%; height: 100%; } .gsw i { display: block; }
.gch:focus-visible .gth { outline: 3px solid var(--focus); outline-offset: 2px; }
.world.lod .gname { display: none; }
/* focus: the selected lineage keeps its light, the rest steps back */
svg.edges path.e { transition: opacity var(--d-state) var(--ease); }
svg.edges path.e.hl { stroke-width: calc(2.6px * min(var(--inv), 2.2)); }

/* first run */
.empty { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; padding: 24px; overflow-y: auto; background: var(--canvas); }
.empty[hidden] { display: none; }
.ecard { width: min(640px, 100%); display: grid; gap: 14px; padding: 26px; border-radius: 20px; background: var(--console); border: 1px solid var(--rule); box-shadow: var(--lift-2); }

.ecard p { margin: 0; color: var(--dim); font-size: 15px; line-height: 1.5; }
.ecard form { display: grid; gap: 8px; }
.ecard textarea.inp { font-size: 17px; min-height: 64px; }
.erow { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

.estarts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.estart { display: grid; gap: 3px; text-align: left; padding: 12px; border-radius: 12px; border: 1px solid var(--rule); background: var(--key); color: var(--text); font-size: 14px; }

.estart:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.mini.gone { display: none; }

button.tally.tb:hover { background: var(--key); }

/* minimap: a navigation instrument in a reserved corner; fit() keeps content out of it */
.mini { position: absolute; right: 12px; bottom: 12px; z-index: 3; width: 200px; border-radius: 14px; background: var(--glass); border: 1px solid var(--rule); box-shadow: var(--lift-2); backdrop-filter: blur(14px); }

.mini svg { display: block; width: 200px; height: 120px; cursor: pointer; touch-action: none; }
.mini.min svg { display: none; }
.mini.auto { display: none; }
.mini rect.mn { fill: var(--rule-strong); opacity: .55; } .mini rect.mn.w { fill: #a67bff; opacity: .9; } .mini rect.mn.s { fill: var(--amber); opacity: 1; }
.mini rect.mf { fill: none; stroke: var(--rule-strong); stroke-dasharray: 3 3; }
.mini rect.mv { fill: none; stroke: var(--text); stroke-width: 1.5; }

/* inspector: a column of the layout (desktop), a bottom sheet (phone) */
.insp { width: var(--insp-w); border-left: 1px solid var(--rule); background: var(--console); overflow: auto; min-height: 0; display: flex; flex-direction: column; }

.tabs { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; }

.ib { padding: 14px 16px 18px; display: grid; gap: 14px; }

.box { border: 1px solid var(--rule); border-radius: 12px; padding: 12px; background: var(--raise); display: grid; gap: 8px; }

.rng { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.rng label { font-size: 13px; color: var(--dim); }

.rng input { grid-column: 1 / -1; width: 100%; accent-color: var(--amber); height: 24px; }
.quote { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--dim); }
.radio { display: grid; gap: 8px; }
.radio label { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--rule); background: var(--raise); font-size: 14px; }
.radio label:has(input:checked) { border-color: var(--amber); background: var(--amber-soft); }
.radio label.dis { opacity: .7; }
.takes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.take { border: 1px solid var(--rule); border-radius: 12px; padding: 8px; background: var(--raise); display: grid; gap: 6px; font-size: 13px; }

/* multi-angle editor */

.cmp { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: var(--film); --split: 50%; touch-action: none; }

.cmp .tag.l { left: 8px; } .cmp .tag.r { right: 8px; }

.tl svg.wave { position: absolute; inset: 0; width: 100%; height: 100%; }

/* deck: the canvas's controls, a row under the work area */
.deck { display: flex; align-items: center; gap: 8px; padding: 0 12px; border-top: 1px solid var(--rule); background: color-mix(in srgb, var(--console) 85%, transparent); min-width: 0; }

/* drawer (media library and friends) */
.drawer { width: var(--drawer-w); border-right: 1px solid var(--rule); background: var(--console); display: flex; flex-direction: column; min-height: 0; }
.drawer .dh { padding: 12px 14px 0; border-bottom: 1px solid var(--rule); }

.drawer .dl { overflow: auto; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
.dcard { border: 1px solid var(--rule); border-radius: 12px; background: var(--raise); padding: 6px; display: grid; gap: 6px; text-align: left; font-size: 13px; cursor: grab; touch-action: none; }
.dcard:hover { border-color: var(--rule-strong); }
.dcard .art { border-radius: 8px; }
.dcard .art .mk { font-size: 13px; height: 22px; left: 5px; top: 5px; padding: 0 7px; }
.dcard b { font-weight: 600; font-size: 13px; display: block; }
.dcard span { color: var(--dim); }
.dghost { position: fixed; z-index: 60; pointer-events: none; width: 140px; opacity: .9; transform: translate(-50%, -50%) rotate(-3deg); box-shadow: var(--lift-3); }
.drawer .dfoot { padding: 10px 14px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--dim); }

/* popovers, palette, sheets, toasts */
.pop { position: fixed; z-index: 50; min-width: 300px; max-width: min(380px, calc(100vw - 24px)); border-radius: 16px; background: var(--console); border: 1px solid var(--rule); box-shadow: var(--lift-3); padding: 8px; }
.pop[hidden] { display: none; }

.opt { display: grid; grid-template-columns: 20px 1fr; gap: 2px 10px; padding: 10px; border-radius: 11px; cursor: pointer; }
.opt[aria-selected="true"], .opt.cur { background: var(--key); }
.opt[aria-checked="true"] .ck { color: var(--amber-ink); }

.opt .on { font-weight: 600; font-size: 14px; }
.opt .os { grid-column: 2; font-size: 13px; color: var(--dim); }
.opt .why { grid-column: 2; font-size: 13px; color: var(--tally); }
.pop .foot { border-top: 1px solid var(--rule); margin-top: 6px; padding: 10px 8px 4px; display: grid; gap: 6px; font-size: 13px; color: var(--dim); }
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); }
.scrim[hidden] { display: none; }
.pal { position: fixed; z-index: 55; left: 50%; top: 12vh; width: min(640px, calc(100vw - 24px)); transform: translateX(-50%); border-radius: 18px; background: var(--console); border: 1px solid var(--rule); box-shadow: var(--lift-3); overflow: hidden; }
.pal[hidden] { display: none; }
.pal .pi { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.pal .pi input { flex: 1; border: 0; background: none; font-size: 17px; outline: none; min-width: 0; }
.pal ul { list-style: none; margin: 0; padding: 6px; max-height: min(56vh, 460px); overflow: auto; }
.pal li.g { font-size: 13px; color: var(--dim); padding: 10px 10px 4px; }
.pal li.o { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 15px; }
.pal li.o .h { color: var(--dim); font-size: 13px; margin-left: auto; text-align: right; }
.pal li.o[aria-selected="true"] { background: var(--key); box-shadow: inset 3px 0 0 var(--amber); }
.pal .pf { display: flex; gap: 14px; flex-wrap: wrap; padding: 10px 16px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--dim); }
.dlg { position: fixed; z-index: 55; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 24px)); max-height: 84dvh; overflow: auto; border-radius: 18px; background: var(--console); border: 1px solid var(--rule); box-shadow: var(--lift-3); padding: 18px; display: grid; gap: 12px; }
.dlg[hidden] { display: none; }
.dlg h2 { margin: 0; font-size: 20px; }
.dlg table { width: 100%; border-collapse: collapse; font-size: 14px; }
.dlg td { padding: 7px 0; border-bottom: 1px solid var(--rule); }
.dlg td:last-child { text-align: right; }
.toasts { position: fixed; z-index: 70; left: 50%; bottom: 76px; transform: translateX(-50%); display: grid; gap: 8px; width: min(520px, calc(100vw - 24px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--console); border: 1px solid var(--rule); box-shadow: var(--lift-3); font-size: 14px; }
.toast button { margin-left: auto; }
.menu { min-width: 340px; }
.menu .opt .on small { font-weight: 500; color: var(--dim); }

/* phone flow (the canvas as a vertical list) */
.flow { display: none; }
.fgrp { padding: 6px 16px 4px 30px; position: relative; }
.fgrp::before { content: ""; position: absolute; left: 16px; top: 0; bottom: 0; width: 2px; background: var(--rule); }
.fgrp h3 { margin: 10px 0 8px; font-size: 13px; font-weight: 600; color: var(--dim); position: relative; }
.fgrp h3::before { content: ""; position: absolute; left: -19px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--console); border: 2px solid var(--rule-strong); }
.fcards { display: grid; gap: 8px; }
.fcards.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.fcard { overflow: hidden; } .fcard .lampw { white-space: normal; align-items: flex-start; } .fcard .lampw .lamp { margin-top: 4px; }
.fcard { display: grid; gap: 6px; text-align: left; padding: 10px; border-radius: 14px; border: 1px solid var(--rule); background: var(--node-bg); box-shadow: var(--lift-1); font-size: 14px; min-width: 0; }
.fcard.sel { border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.fcard.working { box-shadow: 0 0 0 1px var(--violet-light), 0 10px 26px -12px var(--violet-light); }
.fcard .ft { display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
/* titles wrap to three lines: a scene called "01 The stadiu…" is not a scene anyone can find */

.node.halo { box-shadow: 0 0 0 2px var(--amber), 0 0 0 10px var(--amber-soft), 0 0 40px var(--amber-light), var(--lift-2); animation: halo 1.4s var(--ease) 1; }

.tl .bnd { position: absolute; top: -4px; bottom: -4px; width: 14px; margin-left: -7px; border: 0; padding: 0; background: none; cursor: ew-resize; z-index: 5; }
.tl .bnd::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; border-radius: 2px; background: var(--text); opacity: .75; }
.tl .bnd:hover::before, .tl .bnd.on::before, .tl .bnd:focus-visible::before { background: var(--amber); opacity: 1; box-shadow: 0 0 10px var(--amber-light); }
.tl .bnd:focus-visible { outline: none; }
.tl .words { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; }
.tl .wd { position: absolute; bottom: 0; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--p-audio) 60%, transparent); }

.tl .blk .art.tla { position: absolute; inset: 0; border-radius: 0; aspect-ratio: auto; }

.tl .blk .art.tla .pc { font-size: 13px; height: 20px; top: auto; bottom: 4px; }
.tl .mon .art .mk, .tl .mon .art .pc { font-size: 13px; }

#bellBtn[data-n]:not([data-n="0"])::after { content: attr(data-n); position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--amber); color: var(--on-amber); font-size: 13px; font-weight: 600; display: grid; place-items: center; line-height: 1; }
@media (max-width: 1180px) { :root { --insp-w: 360px; --drawer-w: 260px; } .deck .qnote { display: none; } }

  .vp, .mini { display: none; }
  .flow { display: block; position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: 16px; }
  .insp { position: fixed; z-index: 45; left: 0; right: 0; bottom: 0; width: auto; max-height: 88dvh; border-radius: 22px 22px 0 0; border-left: 0; border-top: 1px solid var(--rule); box-shadow: var(--lift-3); }

  .deck .kbtn { padding: 0 10px; }
  .toasts { bottom: 136px; }
  .pal { top: 8px; }
  .menu { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) {

:root.rm *, :root.rm *::before, :root.rm *::after { animation: none !important; transition: none !important; }

/* ---------- simulation (labelled): a stand-in for job events {queued{pos}, stage, elapsed, estimate{basis}} ---------- */
let simT = 0;
function tick(kick) {
  if (S.freeze) return; clearTimeout(simT);
  const live = Object.values(PROJ).flatMap((P) => Object.values(P.N)).filter((n) => n.st === "working" || n.st === "queued");
  if (!live.length) return;
  if (!kick) {
    const working = live.filter((n) => n.st === "working");
    for (const n of live) {
      if (n.st === "queued") { if (working.length < 3) { n.st = "working"; working.push(n); } else continue; }
      n.elapsed += 0.6; n.p = Math.min(100, n.p + 1.4 + Math.random() * 1.6);
      if (n.p >= 100) { if (n.phase === "key") { n.phase = "clip"; n.p = 0; } else { n.st = "ready"; n.phase = null; const num = n.takes.length + 1; n.takes.push({ n: num, rig: Object.assign({}, n.rigNew) }); const cr = (MODEL_CR[n.model] || 48); S.held = Math.max(0, S.held - cr); S.spent += cr; if (S.P.N[n.id] === n) { setSym("sc-" + n.id, n.i, n.rigNew); n.rig = Object.assign({}, n.rigNew); toast(`${n.title}: take ${num} ready. Approve it with A or in Takes.`); } } }
    }
    live.filter((n) => n.st === "queued").forEach((n, k) => (n.queue = k + 1));
    for (const n of live) if (S.P.N[n.id] === n) { const el = document.getElementById("n-" + n.id); if (!el) continue; if (n.st === "ready") { paintNode(n.id); } else { const a = el.querySelector(".art"); if (a) { a.style.setProperty("--p", n.p + "%"); } const pc = el.querySelector(".pc"); if (pc) pc.textContent = n.st === "queued" ? "#" + n.queue : "~" + Math.round(n.p) + "%"; const lw = el.querySelector(".meta .lampw"); if (lw) lw.innerHTML = `<span class="lamp ${n.st}"></span>${esc(statusWord(n))}`; if (el.dataset.ph !== n.st + n.phase) paintNode(n.id); } }
    if (live.some((n) => n.st === "ready")) { renderEdges(); paintNode("cut"); renderStrip(); if (S.sel && nd(S.sel) && nd(S.sel).st === "ready" && live.includes(nd(S.sel))) renderInsp(); }
    renderFlowLite(); renderStrip(); updateTitle(); if (S.tl && !S.playing && !tl._drag) renderTL();
    if (S.sel && nd(S.sel) && live.includes(nd(S.sel))) { const sn = nd(S.sel), ia = insp.querySelector(".ib > .art"); if (ia) { ia.style.setProperty("--p", sn.p + "%"); const ipc = ia.querySelector(".pc"); if (ipc) ipc.textContent = "~" + Math.round(sn.p) + "%"; } const lw = insp.querySelector(".ih .lampw"); if (lw) lw.innerHTML = `<span class="lamp ${nd(S.sel).st}"></span>${esc(statusWord(nd(S.sel)))}`; }
  }
  simT = setTimeout(() => tick(false), 600);
}

// Tidy (FLORA's Autoformat, done for the whole graph): columns follow the data, left to right. A node sits one
// column before the first thing it feeds, so a cast card lands next to the scenes and not at the far left.
// Inside a column, nodes are ordered by where their inputs are, which removes most crossings.
function tidyLayout() {
  layoutFrames();
  const kidOf = {}; nodes().filter(isBox).forEach((b) => b.kids.forEach((k) => (kidOf[k] = b.id)));
  const U = (id) => kidOf[id] || id;
  const units = nodes().filter((n) => !kidOf[n.id]), ids = units.map((n) => n.id);
  if (!ids.length) return;
  const pre = {}, suc = {}; ids.forEach((i) => { pre[i] = new Set(); suc[i] = new Set(); });
  for (const e of allEdges()) { const a = U(e.a), b = U(e.b); if (a !== b && pre[b] && suc[a]) { pre[b].add(a); suc[a].add(b); } }
  const asap = {}, deg = {}, order = []; ids.forEach((i) => { asap[i] = 0; deg[i] = pre[i].size; });
  const q = ids.filter((i) => !deg[i]);
  while (q.length) { const i = q.shift(); order.push(i); for (const s of suc[i]) { asap[s] = Math.max(asap[s], asap[i] + 1); if (--deg[s] === 0) q.push(s); } }
  ids.forEach((i) => { if (!order.includes(i)) order.push(i); });
  const rank = {}, F = nodes().find((n) => n.type === "frame");
  for (const i of order.slice().reverse()) rank[i] = suc[i].size ? Math.max(0, Math.min(...[...suc[i]].map((s) => (s in rank ? rank[s] : asap[s]))) - 1) : asap[i];
  // a note is pinned to the scenes column, after everything else in it
  units.filter((n) => n.type === "note").forEach((n) => (rank[n.id] = F ? rank[F.id] : 0));
  const PRI = { story: 0, sound: 1, look: 2, shots: 3, out: 4, note: 5 };
  const cols = []; units.forEach((n) => (cols[rank[n.id]] = cols[rank[n.id]] || []).push(n));
  let x = 0; const ctr = {};
  const hOf = (n) => (isBox(n) ? n.h : n.h || 200);
  for (const col of cols) {
    if (!col) continue;
    const want = (n) => { const p = [...pre[n.id]].filter((i) => i in ctr); return p.length ? p.reduce((a, i) => a + ctr[i], 0) / p.length : null; };
    col.sort((a, b) => { const wa = want(a), wb = want(b); if (wa != null && wb != null) return wa - wb; if (wa != null) return -1; if (wb != null) return 1; return PRI[T(a).g] - PRI[T(b).g]; });
    let cursor = 0, cw = Math.max(...col.map(W));
    const hasBox = col.some(isBox);
    for (const n of col) {
      // a box keeps room above it for the label it shows when zoomed out
      const w = want(n), top = Math.max(cursor + (isBox(n) ? 110 : 0), w != null ? w - hOf(n) / 2 : -1e9);
      n.x = hasBox && !isBox(n) ? x + cw - W(n) : x; n.y = Math.round(top); ctr[n.id] = top + hOf(n) / 2; cursor = top + hOf(n) + 70;
    }
    x += cw + 110;
  }
  layoutFrames();
}

function splitTopic(topic) {
  if (!topic) { $("#topicIn").focus(); return say("Type a topic first."); }
  const P = S.P; P.empty = false; P.kind = "manual"; P.name = topic.length > 44 ? topic.slice(0, 42) + "…" : topic; P.laid = false;
  const N = (P.N = {}); const add = (o) => (N[o.id] = Object.assign({ x: 0, y: 0, st: "ready" }, o));
  const words = topic.replace(/[?.!]+$/, "");
  const lines = [[`Opening: ${words}`, "Where it begins, in one image."], ["The first clue", "What we notice before we understand."], ["How it works", "The mechanism, shown, not told."], ["The turning point", "The moment everything changes."], ["What it costs", "Who wins, who loses, and why."], ["Where it goes next", "The last image, and the question it leaves."]];
  add({ id: "idea", type: "idea", title: P.name, topic, lang: "English", aspect: "16:9" });
  add({ id: "script", type: "script", title: "6 scene lines", fact: "did not run", st: "ready" });
  add({ id: "voice", type: "voice", title: "Narration · not chosen", voice: "james", st: "draft" });
  const sc = lines.map(([t, l], k) => mkScene("n" + (k + 1), { i: (k * 3 + 1) % 10, t, l }));
  sc.forEach((s) => (N[s.id] = s));
  add({ id: "scenes", type: "frame", cols: 3, kids: sc.map((s) => s.id), title: "Scenes", st: "" });
  add({ id: "cut", type: "cut", title: "Cut", st: "idle" });
  add({ id: "send", type: "send", title: "Private upload", st: "idle" });
  P.edges = [["idea", "topic", "script", "topic"], ["script", "text", "voice", "text"], ["script", "text", "scenes", "script"], ["voice", "audio", "scenes", "timing"], ["scenes", "clips", "cut", "clips"], ["voice", "audio", "cut", "voice"], ["cut", "video", "send", "video"]].map(([a, ap, b, bp], k) => ({ id: "n" + k, a, ap, b, bp }));
  setHeader(); ensureLaid(); fit(false);
  // Krea's agent builds "one layer at a time"; here the columns appear in data order so the path is legible
  if (!RM) nodes().forEach((n) => { const el = document.getElementById("n-" + n.id); if (el) el.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 320, delay: Math.round(n.x / 3), easing: "cubic-bezier(.2,0,0,1)", fill: "backwards" }); });
  select("scenes", { open: true });
  toast("Storyboard ready: 6 draft scenes. Nothing was spent. Edit, reorder, then Quote.");
  say(`Storyboard ready for ${P.name}: 6 draft scenes, not priced. Nothing was spent.`);
}

/* ---------- phone: the canvas as a vertical flow, in graph order ---------- */
function flowCard(n, withArt) {
  const ins = inputsOf(n).map(({ from }) => from.title || T(from).k);
  const no = n.type === "scene" ? sceneNo(n) : 0;
  return `<button class="fcard ${n.st || ""}${S.sel === n.id ? " sel" : ""}" data-id="${n.id}" aria-label="${no ? "Scene " + no + ": " : T(n).k + ": "}${esc(n.title || "note")}. ${esc(statusWord(n))}">
    ${withArt ? sceneArt(n) : ""}<span class="ft"><span class="ty" style="width:24px;height:24px">${ic(T(n).ic || "layers")}</span><b>${no ? pad2(no) + " " : ""}${esc(n.type === "note" ? n.text : n.title)}</b></span>
    <span class="fs"><span class="lampw"><span class="lamp ${n.st}"></span>${esc(statusWord(n))}</span></span>
    ${n.type === "scene" ? `<span class="fs">${esc(modelName(n.model))} · ${mmss(n.dur)}</span>` : ""}${ins.length ? `<span class="fin">from ${esc(ins.join(", "))}</span>` : ""}</button>`;
}
function renderFlow() {
  if (!S.mobile) return;
  const f = $("#flow"); const ns = nodes().filter((n) => !isBox(n));
  let h = "";
  for (const [g, label] of GROUP_ORDER) {
    const list = ns.filter((n) => T(n).g === g && !(g === "shots" && n.type === "scene"));
    const scenes = g === "shots" ? scenesInOrder() : [];
    if (!list.length && !scenes.length) continue;
    h += `<section class="fgrp" aria-label="${label}"><h3>${label}</h3>`;
    if (scenes.length) h += `<div class="fcards two">${scenes.map((s) => flowCard(s, true)).join("")}</div><p class="note" style="margin:8px 0">Long-press a scene, or use Move earlier / later in its sheet, to reorder.</p>`;
    if (list.length) h += `<div class="fcards two">${list.map((n) => flowCard(n, false)).join("")}</div>`;
    h += `</section>`;
  }
  f.innerHTML = h;
}
let flowRaf = 0; function renderFlowLite() { if (!S.mobile || flowRaf) return; flowRaf = requestAnimationFrame(() => { flowRaf = 0; const y = $("#flow").scrollTop; renderFlow(); $("#flow").scrollTop = y; }); }
$("#flow").addEventListener("click", (e) => { const c = e.target.closest(".fcard"); if (c) { if (c._lp) { c._lp = false; return; } select(c.dataset.id, { open: true }); } });
(function longPress() { let t = 0, el = null; $("#flow").addEventListener("pointerdown", (e) => { el = e.target.closest(".fcard"); if (!el || !nd(el.dataset.id) || nd(el.dataset.id).type !== "scene") return; t = setTimeout(() => { el._lp = true; if (navigator.vibrate && !RM) navigator.vibrate(10); const n = nd(el.dataset.id); const f = frameOf(n.id); openDlg(`<h2 id="dlgT">Move ${esc(n.title)}</h2><p>Position ${f.kids.indexOf(n.id) + 1} of ${f.kids.length}.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="kbtn" data-mv="-1" autofocus>Move earlier</button><button class="kbtn" data-mv="1">Move later</button><button class="kbtn" data-q="ok">Done</button></div>`); dlg._mv = n.id; }, 480); });
  ["pointerup", "pointercancel", "pointermove"].forEach((ev) => $("#flow").addEventListener(ev, (e) => { if (ev === "pointermove" && Math.abs(e.movementY) < 4) return; clearTimeout(t); })); })();
dlg.addEventListener("click", (e) => { const b = e.target.closest("[data-mv]"); if (b && dlg._mv) { const n = nd(dlg._mv), f = frameOf(n.id); moveScene(f, n.id, f.kids.indexOf(n.id) + +b.dataset.mv, true); dlg.querySelector("p").textContent = `Position ${f.kids.indexOf(n.id) + 1} of ${f.kids.length}.`; } });

/* ---------- keyboard ---------- */
function typing(e) { const t = e.target; return t.closest && t.closest("input,textarea,select,[contenteditable]") && !(t.type === "checkbox" || t.type === "range"); }
function spatial(fromId, dir) {
  const a = nd(fromId); if (!a) return null; const ax = a.x + W(a) / 2, ay = a.y + (a.h || 200) / 2; let best = null, bd = 1e18;
  for (const n of nodes()) { if (n.id === fromId || isBox(n) || isHid(n.id)) continue; const dx = n.x + W(n) / 2 - ax, dy = n.y + (n.h || 200) / 2 - ay;
    const ok = dir === "ArrowRight" ? dx > 20 && Math.abs(dy) < dx * 1.5 : dir === "ArrowLeft" ? dx < -20 && Math.abs(dy) < -dx * 1.5 : dir === "ArrowDown" ? dy > 20 && Math.abs(dx) < dy * 1.5 : dy < -20 && Math.abs(dx) < -dy * 1.5;
    if (!ok) continue; const d = dx * dx + dy * dy * 1.4; if (d < bd) { bd = d; best = n; } }
  return best;
}
document.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); pal.hidden ? openPal() : closePal(); return; }
  if (!pal.hidden || !dlg.hidden) return;
  if (mod && e.key.toLowerCase() === "z" && !typing(e)) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "y" && !typing(e)) { e.preventDefault(); redo(); return; }
  if (e.key === "Escape") {
    if (!picker.hidden) return closePicker();
    if (!$("#menu").hidden) return closeMenu();
    if (S.armed) { S.armed = null; $$(".port.armed").forEach((p) => p.classList.remove("armed")); return toast("Connection cancelled."); }
    if (S.drawer && (S.mobile || document.activeElement.closest("#drawer"))) { S.drawer = null; renderDrawer(); $("#drawerBtn").focus(); return; }
    if (S.sel) { const id = S.sel; S.sel = null; markSel(); renderEdges(); renderInsp(); document.getElementById("n-" + id)?.focus({ preventScroll: true }) || vp.focus(); return; }
    return;
  }
  if (typing(e) || mod || e.altKey && !e.target.closest(".node")) return;
  const nodeEl = e.target.closest && e.target.closest(".node"); const id = nodeEl && nodeEl.dataset.id;
  if (nodeEl && e.target === nodeEl) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(id, { open: true }); if (!S.mobile) insp.querySelector("button,input,textarea")?.focus(); return; }
    if (e.key.startsWith("Arrow")) {
      e.preventDefault(); const n = nd(id), f = frameOf(id);
      if (e.altKey && f && (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "ArrowDown")) { const step = e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 1; moveScene(f, id, f.kids.indexOf(id) + step, true); return; }
      if (e.altKey) { snap(`Nudge ${n.title}`); const s = e.shiftKey ? 40 : 8; n.x += e.key === "ArrowLeft" ? -s : e.key === "ArrowRight" ? s : 0; n.y += e.key === "ArrowUp" ? -s : e.key === "ArrowDown" ? s : 0; placeAll(); renderEdges(); renderMini(); return; }
      const nx = spatial(id, e.key); if (nx) { document.getElementById("n-" + nx.id).focus({ preventScroll: true }); ensureVisible(nx.id); say((nx.type === "scene" ? "Scene " + sceneNo(nx) + ", " : T(nx).k + ", ") + (nx.title || "") + ". " + statusWord(nx)); } return;
    }
    if (e.key.toLowerCase() === "a" && nd(id).type === "scene") { const n = nd(id); if (n.st === "ready" && n.takes.length) approveTake(n, n.takes[n.takes.length - 1].n); else toast("Only a ready scene's take can be approved."); return; }
    if (e.key.toLowerCase() === "m" && nd(id).type === "scene") { openPicker(id, nodeEl.querySelector('[data-act="picker"]') || nodeEl); return; }
  }
  if (e.target === vp && e.key.startsWith("Arrow")) { e.preventDefault(); const s = e.shiftKey ? 200 : 60; S.view.x += e.key === "ArrowLeft" ? s : e.key === "ArrowRight" ? -s : 0; S.view.y += e.key === "ArrowUp" ? s : e.key === "ArrowDown" ? -s : 0; applyView(); return; }
  if ((e.key === "Delete" || e.key === "Backspace") && !e.target.closest(".insp")) { if (S.selEdge) { e.preventDefault(); removeEdge(S.selEdge); } else if (S.sel && (nodeEl || e.target === vp || e.target === document.body)) { e.preventDefault(); removeNode(S.sel); } return; }
  if (e.target.closest && e.target.closest("button,[role=slider],[role=tab]") && (e.key === " " || e.key === "Enter")) return;
  const k = e.key.toLowerCase();
  if (k === "t") toggleTL(); else if (k === "f") fit(true); else if (k === "+" || k === "=") zoomAt(S.view.k * 1.25, vp.clientWidth / 2, vp.clientHeight / 2, true); else if (k === "-") zoomAt(S.view.k / 1.25, vp.clientWidth / 2, vp.clientHeight / 2, true);
  else if (k === "0") zoomAt(1, vp.clientWidth / 2, vp.clientHeight / 2, true); else if (k === "n") openPal("add "); else if (k === "b") { openDrawer(S.drawer ? null : "media"); }
  else if (k === "v") setMode("sel"); else if (k === "h") setMode("hand"); else if (k === "?") openHelp();
  else if (S.tl && (k === " " || k === "k")) { e.preventDefault(); playToggle(); } else if (S.tl && k === "j") seek(S.t - 5); else if (S.tl && k === "l") seek(S.t + 5);
  else if (k === " ") { spaceDown = true; vp.classList.add("hand"); }
});
document.addEventListener("keyup", (e) => { if (e.key === " ") { spaceDown = false; vp.classList.toggle("hand", S.mode === "hand"); } });
function setMode(m) { S.mode = m; $("#mSel").setAttribute("aria-pressed", String(m === "sel")); $("#mHand").setAttribute("aria-pressed", String(m === "hand")); vp.classList.toggle("hand", m === "hand"); }
function openHelp() {
  const rows = [["Ctrl/Cmd + K", "Command bar: search, add, go, direct"], ["Tab / Shift+Tab", "Move between nodes"], ["Arrow keys (on a node)", "Jump to the nearest node that way"], ["Enter", "Open the node's inspector"],
    ["Alt + arrows (on a scene)", "Reorder the scene"], ["Alt + arrows (other nodes)", "Nudge (Shift: more)"], ["A / M (on a scene)", "Approve latest take / pick model"], ["Ctrl+Z, Ctrl+Shift+Z", "Undo, redo every edit (never a spend)"],
    ["T", "Timeline view of the same project"], ["Space, K / J / L", "Play, pause / back 5 s / forward 5 s (timeline open)"], ["F, +, −, 0", "Fit, zoom in, zoom out, 100%"], ["N", "Add a node"], ["B", "Library drawer"], ["V / H, hold Space", "Select / hand; pan"], ["Delete", "Remove the selected node or line (undoable)"], ["Esc", "Close, cancel, deselect"]];
  openDlg(`<h2 id="dlgT">Keyboard</h2><table><tbody>${rows.map(([a, b]) => `<tr><td><kbd>${a}</kbd></td><td>${b}</td></tr>`).join("")}</tbody></table><div style="text-align:right"><button class="kbtn" data-q="ok" autofocus>Close</button></div>`);
}

/* ---------- chrome: theme, motion, menus, project switch ---------- */
function setTheme(t) { document.documentElement.dataset.theme = t; $("#themeIc").innerHTML = IC[t === "dark" ? "sun" : "moon"]; $("#themeBtn").setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme"); }
function toggleTheme() { setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); }
function setRM(on) { RM = on; document.documentElement.classList.toggle("rm", on); toast(on ? "Reduced motion: lines show static dashes, views jump instead of glide. Every state stays readable." : "Motion back on."); }
const menu = $("#menu"); let menuOpener = null;
function openMenu(anchor, html) { menuOpener = anchor; menu.innerHTML = html; menu.hidden = false; anchor.setAttribute("aria-expanded", "true"); const r = anchor.getBoundingClientRect(); const w = Math.min(380, innerWidth - 24);
  menu.style.left = clamp(r.left, 12, innerWidth - w - 12) + "px"; // a menu opened from the deck has no room below it, so it opens upwards
  const up = (S.mobile && anchor.id === "adminBtn") || r.bottom + 6 + menu.offsetHeight > innerHeight - 8;
  menu.style.top = Math.max(8, up ? r.top - menu.offsetHeight - 8 : r.bottom + 6) + "px"; menu.querySelector("[role=menuitem],[role=menuitemradio]")?.focus(); }
function closeMenu() { menu.hidden = true; menuOpener?.setAttribute("aria-expanded", "false"); menuOpener?.focus(); }
menu.addEventListener("keydown", (e) => { const it = $$("[role=menuitem],[role=menuitemradio]", menu); const i = it.indexOf(document.activeElement); if (e.key === "ArrowDown") { e.preventDefault(); it[(i + 1) % it.length].focus(); } else if (e.key === "ArrowUp") { e.preventDefault(); it[(i - 1 + it.length) % it.length].focus(); } else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); closeMenu(); } });
menu.addEventListener("click", (e) => { const m = e.target.closest("[data-m]"); if (!m) return; const v = m.dataset.m; closeMenu(); if (v === "film" || v === "run" || v === "new") switchProj(v); else toast(`Prototype: would open ${v}.`); });
$("#projBtn").addEventListener("click", (e) => openMenu(e.currentTarget, `<h3>Projects on this channel</h3>${S.P.id === "new" ? `<div class="opt" role="menuitem" tabindex="-1" data-m="new"><span class="ck">${ic("check")}</span><span class="on">${esc(S.P.name)} <small>· project, new</small></span><span class="os">Draft, nothing spent</span></div>` : ""}
  <div class="opt" role="menuitem" tabindex="-1" data-m="film"><span class="ck">${S.P.id === "film" ? ic("check") : ""}</span><span class="on">Football in 2050 <small>· project, manual</small></span><span class="os">8 scenes · you drive</span></div>
  <div class="opt" role="menuitem" tabindex="-1" data-m="run"><span class="ck">${S.P.id === "run" ? ic("check") : ""}</span><span class="on">The first World Cup on Mars <small>· autopilot</small></span><span class="os">Today 06:00 · waiting at Storyboard ready</span></div>
  <div class="opt" role="menuitem" tabindex="-1" data-m="the Sketch canvas (today's Create)"><span class="ck"></span><span class="on">Sketch <small>· your scratchpad</small></span><span class="os">One-off images, clips and voices (was Create)</span></div>
  <div class="opt" role="menuitem" tabindex="-1" data-m="new"><span class="ck">${ic("idea")}</span><span class="on">New project…</span><span class="os">Type a topic, then split it into scenes</span></div>`));
$("#adminBtn").addEventListener("click", (e) => openMenu(e.currentTarget, `<h3>Admin (Boshqaruv)</h3>${["Channels", "Portfolio", "Providers", "Models"].map((l) => `<div class="opt" role="menuitem" tabindex="-1" data-m="Admin › ${l}"><span class="ck"></span><span class="on">${l}</span></div>`).join("")}<div class="foot">The rest of the operator console (agents, jobs, intelligence, system) is unchanged.</div>`));
$$(".rail a[data-nav]").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); toast(`Prototype: would open ${a.dataset.nav}.`); }));
function switchProj(id) {
  if (S.P.id === id) return; S.view0 = S.view0 || {}; S.view0[S.P.id] = Object.assign({}, S.view);
  if (id === "new") { PROJ.new = newProject(); $("#empty")._built = false; delete S.view0.new; }
  if (S.tl && id === "new") toggleTL(false);
  S.P = PROJ[id]; S.sel = null; S.selEdge = null; setHeader(); ensureLaid();
  renderAll(); renderInsp(); if (S.view0[id]) { S.view = S.view0[id]; applyView(); } else fit(false);
  if (id === "new") requestAnimationFrame(() => $("#topicIn")?.focus());
  say(`Opened ${S.P.name}. ${S.P.id === "run" ? "Autopilot run, same canvas." : ""}`);
}

pal.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.stopPropagation(); closePal(); } });

/* ---------- init (deep links for review: #theme= &view=timeline &sel= &tab= &pal= &proj=run &drawer= &freeze=1 &k=) ---------- */
setTheme(HASH.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));

if (HASH.proj === "new") PROJ.new = newProject();
