name: Daily YouTube Video

on:
  schedule:
    # Hourly. The `resolve` job below asks the channel registry which channels
    # are due at THIS UTC hour and emits a matrix; every other hour costs one
    # short job that resolves to an empty matrix and stops. GitHub cron cannot
    # read a database, so this is how a per-channel `publish_hour_utc` becomes
    # a real schedule without hardcoding anyone's hour into this file.
    #
    # With only the default channel configured (publish_hour_utc 15) exactly
    # one video job runs per day, at 15:00 UTC — unchanged from before.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel id (empty = every ACTIVE channel)"
        required: false
        default: ""
      niche:
        description: "Video niche (empty = the channel's own niche)"
        required: false
        default: ""
      topic:
        description: "Override topic (leave empty for AI pick)"
        required: false
        default: ""
      privacy:
        description: "YouTube privacy"
        required: false
        default: "private"
        type: choice
        options: [private, unlisted, public]
      duration:
        description: "Target length in seconds (empty = the channel's own)"
        required: false
        default: ""
      language:
        description: "Script language, e.g. English/Arabic (empty = the channel's own)"
        required: false
        default: ""
      visual_style:
        description: "Visual style directive or preset name (empty = the channel's own)"
        required: false
        default: ""
      video_provider:
        description: "Image→video model for this run (empty = repo default)"
        required: false
        default: ""
        type: choice
        options: ["", minimax, higgsfield, kling, veo, seedance, wan]
      image_provider:
        description: "Image model for this run (empty = repo default)"
        required: false
        default: ""
        type: choice
        options: ["", pexels, leonardo]

jobs:
  # ---------------------------------------------------------------------------
  # Which channels run this hour. Deliberately cheap: it installs two pure-Python
  # packages rather than requirements.txt (which pulls torch), so the 23 hours a
  # day that resolve to nothing cost seconds.
  # ---------------------------------------------------------------------------
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install resolver dependencies
        run: pip install requests python-dotenv

      - name: Pick due channels
        id: pick
        env:
          # Read-only use: the registry reads the `channels` table the Command
          # Center writes. No publishing token is read here.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_CHANNEL:-}" ]; then
            # An explicit manual run targets exactly that channel, whatever the hour.
            MATRIX=$(python tools/list_channels.py --only "$INPUT_CHANNEL")
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual run with no channel: every ACTIVE channel, ignoring the hour.
            MATRIX=$(python tools/list_channels.py)
          else
            MATRIX=$(python tools/list_channels.py --due-hour "$(date -u +%-H)")
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          COUNT=$(printf '%s' "$MATRIX" | python -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Due this run ($COUNT): $MATRIX"

  # ---------------------------------------------------------------------------
  # One job per due channel. fail-fast: false is the isolation guarantee — a
  # credential failure or a render crash on one channel must not cancel another
  # channel's video.
  # ---------------------------------------------------------------------------
  make-video:
    needs: resolve
    if: needs.resolve.outputs.count > 0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: make-video (${{ matrix.channel_id }})
    strategy:
      fail-fast: false
      max-parallel: 1  # one ffmpeg render at a time on a 2-core runner
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu
          # MoviePy's TextClip(method="caption") writes the subtitle text to a
          # temp file and hands ImageMagick `label:@/tmp/…`. Ubuntu ships a
          # policy.xml that denies reading any `@`-referenced path, so every
          # subtitle render dies with "operation not allowed by the security
          # policy `@/tmp/…'" — which is what stopped the pipeline at the
          # subtitle stage (not memory; the run peaked well under the runner's
          # 16 GB). Re-enable just that one path read; every other policy
          # (PS/PDF/etc.) stays as shipped.
          for p in /etc/ImageMagick-6/policy.xml /etc/ImageMagick-7/policy.xml; do
            if [ -f "$p" ]; then
              sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' "$p"
            fi
          done

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore history state (chronos.db, topic_vectors.npz, topics.json, pipeline_runs.json)
        uses: actions/cache@v4
        with:
          path: history
          key: chronos-history-${{ github.run_number }}
          restore-keys: chronos-history-

      # The legacy default channel's token, and only its own. Every other
      # channel gets its own in the step below; before that step existed, EVERY
      # channel in the matrix ran with this one, so a video made for a new
      # channel would have uploaded to the default channel's account.
      - name: Restore YouTube token (default channel)
        if: matrix.is_default
        env:
          # Passed through env rather than interpolated into the script text:
          # the value never becomes part of a command line, and a JSON body
          # containing a quote cannot break out of one.
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          # Say which way this went. Silence here meant a run could look
          # perfectly normal while no token was ever written, and the failure
          # only surfaced later as "no usable token" from deep inside the
          # OAuth path. Only the fact is printed, never any part of the value.
          if [ -n "${YOUTUBE_TOKEN_JSON:-}" ]; then
            printf '%s' "$YOUTUBE_TOKEN_JSON" > youtube_token.json
            echo "YOUTUBE_TOKEN_JSON is set — wrote youtube_token.json ($(wc -c < youtube_token.json) bytes)."
          else
            echo "YOUTUBE_TOKEN_JSON is EMPTY OR UNSET — no token file written, so"
            echo "publishing and analytics will be skipped. Check that it is stored"
            echo "under Settings -> Secrets and variables -> Actions -> Repository"
            echo "secrets (an Environment or Dependabot secret is NOT visible here)."
          fi

      # This channel's own token, for every channel that is not the legacy
      # default. `matrix.token_secret` is the secret NAME, computed by
      # tools/list_channels.py from the same function the publishing side uses
      # to read it (channel_credentials.env_var_name), so the two cannot drift.
      #
      # The value is exported under that exact name and nothing else is done
      # with it: modules/channel_credentials.materialize_token() reads the env
      # var and writes the file at the path that channel's uploader, analytics
      # client and comment fetcher all resolve to. Duplicating that path in
      # bash is how the two would fall out of step.
      - name: Restore YouTube token (this channel)
        if: ${{ !matrix.is_default }}
        env:
          CHANNEL_TOKEN_JSON: ${{ secrets[matrix.token_secret] }}
          TOKEN_SECRET_NAME: ${{ matrix.token_secret }}
        run: |
          if [ -n "${CHANNEL_TOKEN_JSON:-}" ]; then
            # The heredoc form is required for a multi-line value. Actions masks
            # the secret in the log; only its length is printed here.
            {
              echo "${TOKEN_SECRET_NAME}<<CHRONOS_TOKEN_EOF"
              printf '%s\n' "$CHANNEL_TOKEN_JSON"
              echo "CHRONOS_TOKEN_EOF"
            } >> "$GITHUB_ENV"
            echo "$TOKEN_SECRET_NAME is set (${#CHANNEL_TOKEN_JSON} bytes) — this channel will publish to its own account."
          else
            echo "$TOKEN_SECRET_NAME is EMPTY OR UNSET, so this channel has no token of"
            echo "its own. Publishing and analytics will be skipped for it. This is"
            echo "deliberate: falling back to the default channel's token would upload"
            echo "this channel's video to somebody else's account. Add the token in the"
            echo "Command Center's channel wizard, which forwards it under this name."
          fi

      - name: Restore YouTube client secret
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          # Only when the secret is actually set. Writing it unconditionally
          # left an EMPTY client_secret.json behind, which passes an exists()
          # check and then fails deep inside the OAuth library with a bare
          # JSONDecodeError. No file at all produces a message that names the
          # missing secret.
          if [ -n "${YOUTUBE_CLIENT_SECRET_JSON:-}" ]; then
            printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
          else
            echo "YOUTUBE_CLIENT_SECRET_JSON is not set — YouTube API calls will be skipped."
          fi

      - name: Generate audio assets
        run: python tools/generate_assets.py

      - name: Run Chronos bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_PRIVACY: ${{ github.event.inputs.privacy || 'private' }}
          # Narration provider. Leave it to config's own default (config.py):
          # ElevenLabs whenever ELEVENLABS_API_KEY is set — a natural voice is a
          # real retention lever — and edge only when no key exists. An explicit
          # repo VARIABLE TTS_PROVIDER still overrides (set it to "edge" to force
          # the robotic voice on purpose). Note: an empty override string is
          # honored by config, so this passes the var only when it is non-empty.
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          SCRIPT_LANGUAGE: English
          # x264 encoder threads for the final render. The render has been
          # OOM-killed at exit 143 with ffmpeg eating the 7.9 GB runner; set
          # this repo VARIABLE to 1 to halve the encoder's peak frame buffers
          # (a little slower, the same file). Empty = the code default (2), so
          # nothing changes unless it is set. See modules/compositor.py.
          NIGHTSHIFT_RENDER_THREADS: ${{ vars.NIGHTSHIFT_RENDER_THREADS }}
          # Dispatch inputs and the matrix channel are passed through the
          # environment, never interpolated into the shell below. GitHub
          # expands ${{ ... }} as raw text before the shell runs, so a topic
          # like  '; rm -rf ~ #  spliced straight into a command would execute;
          # as an env var it is just a string the shell reads with "$VAR".
          CHANNEL_ID: ${{ matrix.channel_id }}
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_NICHE: ${{ github.event.inputs.niche }}
          # Per-run controls (empty on a scheduled run, so the channel's own
          # settings apply exactly as before). Passed through the environment,
          # never interpolated into the shell — same injection guard as topic.
          INPUT_DURATION: ${{ github.event.inputs.duration }}
          INPUT_LANGUAGE: ${{ github.event.inputs.language }}
          INPUT_VISUAL_STYLE: ${{ github.event.inputs.visual_style }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # --- AITuber presenter (optional, off unless enabled) -------------
          # The synthetic on-camera character (modules/avatar.py). Faceless by
          # default: NIGHTSHIFT_AVATAR_ENABLED must be an explicit true, and the
          # Higgsfield credentials must be set, or the run stays faceless. An
          # unset secret is an empty string; the provider then fails loud only
          # when the presenter is enabled — it never ships a blank/wrong avatar.
          # To turn the presenter on: set the NIGHTSHIFT_AVATAR_ENABLED repo
          # VARIABLE to true and add the two HIGGSFIELD_API_KEY_* SECRETS. The
          # model defaults to Kling 3.0 (the cost-effective pick, ~6 credits per
          # generation); leave HIGGSFIELD_AVATAR_ENDPOINT unset to use it, or set
          # the variable to override with another model path.
          NIGHTSHIFT_AVATAR_ENABLED: ${{ vars.NIGHTSHIFT_AVATAR_ENABLED }}
          HIGGSFIELD_API_KEY_ID: ${{ secrets.HIGGSFIELD_API_KEY_ID }}
          HIGGSFIELD_API_KEY_SECRET: ${{ secrets.HIGGSFIELD_API_KEY_SECRET }}
          HIGGSFIELD_AVATAR_ENDPOINT: ${{ vars.HIGGSFIELD_AVATAR_ENDPOINT }}
          # --- Opt-in providers & agent (keys from the Command Center's -------
          # Providers board, forwarded here as Actions secrets). Every one is
          # OFF unless configured: an unset secret expands to "" (feature off),
          # and the toggle VARIABLES below default to empty (off) too, so a
          # deployment that sets none of these behaves exactly as before.
          #
          # AI b-roll video provider (modules/video_providers.py). Default
          # "minimax". To use another, set the CHRONOS_VIDEO_PROVIDER variable
          # (higgsfield|kling|veo|seedance|wan) AND CHRONOS_ENABLE_VIDEO_GEN=true
          # AND that provider's key secret.
          # A per-run dispatch input overrides the repo default; choosing one
          # also turns generation on for that run (empty input = repo behaviour).
          CHRONOS_VIDEO_PROVIDER: ${{ github.event.inputs.video_provider || vars.CHRONOS_VIDEO_PROVIDER }}
          CHRONOS_ENABLE_VIDEO_GEN: ${{ github.event.inputs.video_provider != '' && 'true' || vars.CHRONOS_ENABLE_VIDEO_GEN }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          CHRONOS_ENABLE_MINIMAX_BROLL: ${{ vars.CHRONOS_ENABLE_MINIMAX_BROLL }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          KLING_API_KEY: ${{ secrets.KLING_API_KEY }}
          VEO_API_KEY: ${{ secrets.VEO_API_KEY }}
          SEEDANCE_API_KEY: ${{ secrets.SEEDANCE_API_KEY }}
          WAN_API_KEY: ${{ secrets.WAN_API_KEY }}
          # AI image provider (modules/image_providers.py). Default "pexels"
          # stock; set CHRONOS_IMAGE_PROVIDER=leonardo + CHRONOS_ENABLE_IMAGE_GEN
          # + LEONARDO_API_KEY to generate bespoke stills.
          CHRONOS_IMAGE_PROVIDER: ${{ github.event.inputs.image_provider || vars.CHRONOS_IMAGE_PROVIDER }}
          CHRONOS_ENABLE_IMAGE_GEN: ${{ github.event.inputs.image_provider != '' && github.event.inputs.image_provider != 'pexels' && 'true' || vars.CHRONOS_ENABLE_IMAGE_GEN }}
          LEONARDO_API_KEY: ${{ secrets.LEONARDO_API_KEY }}
          # Extra LLM keys (opt-in; Gemini above remains the default scripter).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # vidIQ research & scoring (advisory only).
          VIDIQ_ACCESS_TOKEN: ${{ secrets.VIDIQ_ACCESS_TOKEN }}
          CHRONOS_ENABLE_VIDIQ: ${{ vars.CHRONOS_ENABLE_VIDIQ }}
          # Autopilot: pick the day's topic from this channel's trend signals.
          CHRONOS_AGENT_AUTOPILOT: ${{ vars.CHRONOS_AGENT_AUTOPILOT }}
          # Advisory AI critic on rendered frames (Gemini vision; one or two
          # paid calls per video). Off unless this variable is set to 1.
          CHRONOS_AI_CRITIC: ${{ vars.CHRONOS_AI_CRITIC }}
          # --- Per-channel publishing tokens -------------------------------
          # GitHub Actions secrets cannot be enumerated at runtime, so each
          # channel's token secret is listed here explicitly — one line per
          # channel, added when the channel is created (see the Add Channel
          # flow in docs/MULTI_CHANNEL.md). An unset secret is an empty string,
          # which modules/channel_credentials.py reports as "not connected"; it
          # never falls back to another channel's token.
          #
          # Naming: CHRONOS_YT_TOKEN_<REF>, where <REF> is the channel's
          # credential ref upper-cased. Example, for ref "finance":
          # CHRONOS_YT_TOKEN_FINANCE: ${{ secrets.CHRONOS_YT_TOKEN_FINANCE }}
        run: |
          # Build argv as an array so each value stays one argument. No value
          # is ever re-parsed by the shell: env vars are read with "$VAR", and
          # "${args[@]}" hands python exactly the elements we appended.
          args=(--channel "$CHANNEL_ID" --privacy "${YOUTUBE_PRIVACY:-private}")
          if [ -n "$INPUT_TOPIC" ]; then
            args+=(--topic "$INPUT_TOPIC")
          fi
          if [ -n "$INPUT_NICHE" ]; then
            args+=(--niche "$INPUT_NICHE")
          fi
          if [ -n "${INPUT_DURATION:-}" ]; then
            args+=(--duration "$INPUT_DURATION")
          fi
          if [ -n "${INPUT_LANGUAGE:-}" ]; then
            args+=(--language "$INPUT_LANGUAGE")
          fi
          if [ -n "${INPUT_VISUAL_STYLE:-}" ]; then
            args+=(--visual-style "$INPUT_VISUAL_STYLE")
          fi
          python main.py "${args[@]}"

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.channel_id }}-${{ github.run_number }}
          path: |
            output/*/final_video.mp4
            output/*/thumbnails/*.jpg
            logs/run.log
          retention-days: 7

      - name: Save history state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: history
          key: chronos-history-${{ github.run_number }}-${{ matrix.channel_id }}
