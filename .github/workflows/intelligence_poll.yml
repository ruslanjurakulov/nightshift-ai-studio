name: Intelligence Poll

on:
  schedule:
    # 20:00 UTC daily — 5 hours after the video job (15:00 UTC), giving a
    # freshly-published video some time to accumulate views/comments before
    # this runs. Cheap in quota either way: competitor/trend polling costs
    # ~1-3 YouTube Data API units total (see modules/competitor_monitor.py,
    # modules/trend_detector.py); the Gemini cost is comment classification,
    # which scales with how many comments actually came in, not a fixed fee.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      skip_comments:
        description: "Skip comment fetch/classify pass"
        required: false
        default: false
        type: boolean

# Least privilege (BR-S-001): nothing in this workflow calls the GitHub API or
# pushes, so the job token can only read the repository. The cache and
# artifact actions authenticate with the runner's own token, not this one.
permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never pushes: keeps the job token out of .git/config (BR-S-001).
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -c constraints.txt -r requirements.txt

      # Restore only; the one save is "Save history state" at the end. With the
      # combined actions/cache action its post step tried to save the same key a
      # second time and failed every day ("Unable to reserve cache with key
      # chronos-history-<n>"), a warning that would hide a real save failure.
      - name: Restore history state (chronos.db, topic_vectors.npz, topics.json, pipeline_runs.json)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: history
          key: chronos-history-${{ github.run_number }}
          restore-keys: chronos-history-

      # Secrets reach these steps through `env:` only, never spliced into the
      # script text: GitHub expands ${{ ... }} before the shell runs, so a
      # value containing a quote would otherwise end the string and run the
      # rest as commands. Same steps as daily_video.yml.
      - name: Restore YouTube token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          # Say which way this went. Silence here meant a run could look
          # perfectly normal while no token was ever written, and the failure
          # only surfaced later as "no usable token" from deep inside the
          # OAuth path. Only the fact is printed, never any part of the value
          # (not its length either). A value that is not a JSON object is not
          # written; the warning names the secret to fix.
          umask 077
          if [ -z "${YOUTUBE_TOKEN_JSON:-}" ]; then
            echo "YOUTUBE_TOKEN_JSON is EMPTY OR UNSET — no token file written, so"
            echo "publishing and analytics will be skipped. Check that it is stored"
            echo "under Settings -> Secrets and variables -> Actions -> Repository"
            echo "secrets (an Environment or Dependabot secret is NOT visible here)."
          elif python tools/validate_json_env.py --warning YOUTUBE_TOKEN_JSON; then
            printf '%s\n' "$YOUTUBE_TOKEN_JSON" > youtube_token.json
            echo "YOUTUBE_TOKEN_JSON is set — wrote youtube_token.json."
          else
            echo "YOUTUBE_TOKEN_JSON is not a JSON object — no token file written, so"
            echo "analytics will be skipped."
          fi

      # The default channel connected from the Command Center (migration 0115)
      # keeps its refresh token in Supabase Vault: the analytics and comment
      # polls must use the same token the video run does. With no active
      # connection this does nothing and the secret above applies, as before.
      - name: Restore YouTube token from Vault (default channel)
        # The poll is advisory and never spends: a failure here must not stop it
        # (the video run is the step that fails closed).
        continue-on-error: true
        env:
          CHANNEL_ID: default
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: python tools/restore_channel_token.py

      - name: Restore YouTube client secret
        env:
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          # Only when the secret is actually set. Writing it unconditionally
          # left an EMPTY client_secret.json behind, which passes an exists()
          # check and then fails deep inside the OAuth library with a bare
          # JSONDecodeError. No file at all produces a message that names the
          # missing secret. A value that is not a JSON object is not written
          # either; the warning names the secret.
          umask 077
          if [ -z "${YOUTUBE_CLIENT_SECRET_JSON:-}" ]; then
            echo "YOUTUBE_CLIENT_SECRET_JSON is not set — YouTube API calls will be skipped."
          elif python tools/validate_json_env.py --warning YOUTUBE_CLIENT_SECRET_JSON; then
            printf '%s\n' "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
          else
            echo "YOUTUBE_CLIENT_SECRET_JSON is not a JSON object — YouTube API calls will be skipped."
          fi

      - name: Run intelligence poll
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The poll classifies comments: GEMINI_MODEL_OTHER (empty = GEMINI_MODEL, empty = the code default).
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_MODEL_OTHER: ${{ vars.GEMINI_MODEL_OTHER }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          COMPETITOR_CHANNEL_IDS: ${{ vars.COMPETITOR_CHANNEL_IDS }}
          # vidIQ keyword research for the poll (modules/intelligence_poller.py), advisory only: needs both
          # the token and the flag, exactly as in daily_video.yml. Unset = no research, no fabricated numbers.
          VIDIQ_ACCESS_TOKEN: ${{ secrets.VIDIQ_ACCESS_TOKEN }}
          CHRONOS_ENABLE_VIDIQ: ${{ vars.CHRONOS_ENABLE_VIDIQ }}
          # Revenue tracking (config.py): adds the monetary analytics scope, so it also needs the channel
          # re-consented (tools/connect_channel.py). Empty = off, the analytics poll keeps its narrower scopes.
          CHRONOS_ENABLE_REVENUE: ${{ vars.CHRONOS_ENABLE_REVENUE }}
          # How many days of own videos the daily analytics poll re-reads (1..90; empty = only videos published since
          # yesterday, as before). Up to 3 Analytics calls per video per channel, capped at 600 calls and 10 minutes;
          # see docs/RESULTS_DASHBOARD.md. Older videos' readings are filed apart and the decision engines (feedback,
          # topic scores, quota split, publish timing) do not read them; the dashboard does.
          NIGHTSHIFT_METRICS_POLL_DAYS: ${{ vars.NIGHTSHIFT_METRICS_POLL_DAYS }}
          # The day's upload budget the quota allocator splits across channels (empty = one slot per channel).
          CHRONOS_DAILY_UPLOAD_SLOTS: ${{ vars.CHRONOS_DAILY_UPLOAD_SLOTS }}
          # Optional — when set, the poll mirrors state to Supabase for the
          # Command Center. Unset = fully local, mirror is a no-op.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # --- Per-channel tokens -------------------------------------------
          # This poll reads analytics and comments for every ACTIVE channel, so
          # each non-default channel needs its own token here exactly as in
          # daily_video.yml — Actions secrets cannot be enumerated at runtime.
          # One line per channel, added when the channel is created:
          # CHRONOS_YT_TOKEN_FINANCE: ${{ secrets.CHRONOS_YT_TOKEN_FINANCE }}
          # An unset secret reports as not_connected; it never falls back to
          # another channel's token.
          # The dispatch input, through env like every other value.
          INPUT_SKIP_COMMENTS: ${{ github.event.inputs.skip_comments }}
        run: |
          args=()
          if [ "${INPUT_SKIP_COMMENTS:-}" = "true" ]; then
            args+=(--skip-comments)
          fi
          python tools/run_intelligence_poll.py "${args[@]}"

      - name: Upload poll log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intelligence-poll-${{ github.run_number }}
          path: logs/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Save history state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: history
          # "-poll": this workflow's run numbers are not daily_video's, so the
          # bare number could one day name a cache that workflow already holds.
          key: chronos-history-${{ github.run_number }}-poll
