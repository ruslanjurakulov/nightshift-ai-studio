name: Nightshift Codex Cloud dispatcher (bounded)

# GitHub official Codex integration can act on @codex PR comments.
# Comments from github-actions[bot] may not trigger Codex; verify before relying.
on:
  workflow_run:
    workflows: ["Tests", "Frontend", "Phase 2B.1F storage ownership evidence"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: nightshift-codex-dispatch-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'ruslanjurakulov/nightshift-ai-studio' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Trusted main checkout only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p test_nightshift_codex_dispatcher.py
      - name: Evaluate and dispatch one bounded PR comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/nightshift_codex_dispatcher.py
