name: Phase 2B.1F storage ownership evidence

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnostic subset or unchanged complete migration chain
        type: choice
        default: ownership
        options: [ownership, full_chain, policy_repro]

permissions:
  contents: read

jobs:
  ownership-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NIGHTSHIFT_TEST_PROJECT: nightshift-phase2b1f
      NIGHTSHIFT_TEST_MODE: ${{ inputs.mode || 'ownership' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resource and remote-target preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ $(df -Pk . | awk 'NR==2 {print $4}') -ge 8388608 ]] || { echo 'BLOCKED: insufficient disk'; exit 2; }
          [[ $(awk '/MemAvailable:/ {print $2}' /proc/meminfo) -ge 6291456 ]] || { echo 'BLOCKED: insufficient memory'; exit 2; }
          test -S /var/run/docker.sock
          docker info --format 'docker={{.ServerVersion}} storage={{.Driver}}' >/dev/null
          if compgen -v | grep -E '^(SUPABASE_(URL|SERVICE_KEY)|DATABASE_URL)$' >/dev/null; then
            echo 'remote database variables are forbidden' >&2
            exit 1
          fi

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.122.0

      - name: Prepare isolated test project
        shell: bash
        run: tests/postgres/prepare_supabase.sh

      - name: Collect storage ownership evidence
        env:
          # Official mirror; GHCR returned toomanyrequests in X5.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ownership-evidence
          set +e
          tests/postgres/diagnose_storage_ownership.sh ownership-evidence
          rc=$?
          set -e
          # Only the validated report is publishable. Raw files stay private
          # on this disposable VM and are never artifact inputs.
          test -s ownership-evidence/report.json
          cat ownership-evidence/report.json | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload sanitized ownership evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase2b1f-storage-ownership-${{ github.run_id }}
          path: ownership-evidence/report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local stack
        if: always()
        shell: bash
        run: timeout 120s supabase stop --no-backup >/dev/null 2>&1

      - name: Restore ephemeral test files
        if: always()
        shell: bash
        run: tests/postgres/cleanup_supabase.sh
