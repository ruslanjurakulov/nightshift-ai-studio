name: Telegram Control Panel

# Polls Telegram for admin commands (/status, /channels, /pending, /publish,
# /pause, /resume) and replies. A scheduled poll rather than an always-on
# webhook: replies land within the interval below, which is fine for a control
# panel and needs no hosted service. Harmless until the secrets are set — the
# script exits 0 and does nothing without TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID.

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:

# One run at a time, and let an in-flight poll finish rather than cancelling it
# (cancelling mid-batch could drop the offset write and reprocess messages).
concurrency:
  group: telegram-control
  cancel-in-progress: false

# Least privilege (BR-S-001): nothing in this workflow calls the GitHub API or
# pushes, so the job token can only read the repository. The cache and
# artifact actions authenticate with the runner's own token, not this one.
permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never pushes: keeps the job token out of .git/config (BR-S-001).
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore history state (holds the Telegram update offset + local db)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: history
          key: chronos-history-${{ github.run_number }}
          restore-keys: chronos-history-

      - name: Poll Telegram control panel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional — lets StoreDeps read channel/video state when mirrored.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python tools/run_telegram_control.py

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telegram-control-log
          path: logs/
          if-no-files-found: ignore
