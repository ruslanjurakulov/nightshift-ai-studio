name: Video engine

# The Remotion scene renderer in video-engine/ (roadmap PR 3.2). Typechecks
# the project and renders one tiny fixture scene so a broken composition is
# caught before it reaches the pipeline. Scoped to video-engine/** so no other
# change pays for npm install or a Chromium download.

on:
  push:
    branches: [main]
    paths:
      - "video-engine/**"
      - "samples/timeline_year_cases.json"
      - ".github/workflows/video-engine.yml"
  pull_request:
    branches: [main]
    paths:
      - "video-engine/**"
      - "samples/timeline_year_cases.json"
      - ".github/workflows/video-engine.yml"
  workflow_dispatch:

concurrency:
  group: video-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: video-engine

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video-engine/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # The timeline year reader and its Python twin
      # (modules/graphic_recipes.timeline_dates) read the same cases.
      - name: Shared text cases
        run: node --experimental-strip-types --no-warnings --test tests/text-cases.test.mts

      # Smoke render. Bundle once (webpack is the slow part), then render
      # 2 s, 640x360 clips (60 frames, one worker) of the title card, the map
      # zoom (a local SVG map, no tiles) and the timeline, and a single still
      # of the quote card, evidence card and lower third. `browser ensure`
      # fetches Remotion's headless Chromium once.
      - name: Smoke render
        if: ${{ !cancelled() }}
        run: |
          npx remotion browser ensure
          npx remotion bundle src/index.ts --out-dir=out/bundle --public-dir=fixtures/public --log=error
          FFPROBE=$(ls node_modules/@remotion/compositor-linux-x64-*/ffprobe | head -1)
          for f in title-card map-zoom timeline; do
            npx remotion render out/bundle Scene "out/$f.mp4" \
              --props="fixtures/$f.json" --concurrency=1 --log=error
            frames=$("$FFPROBE" -v error -select_streams v:0 -count_packets \
              -show_entries stream=nb_read_packets -of default=nw=1:nk=1 "out/$f.mp4" | head -1)
            echo "$f frames=$frames"
            test "$frames" = "60"
          done
          for f in quote-card evidence-card lower-third; do
            npx remotion still out/bundle Scene "out/$f.png" \
              --props="fixtures/$f.json" --frame=45 --log=error
            test -s "out/$f.png"
          done
