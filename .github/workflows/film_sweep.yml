name: Film Sweep

# One recorded Film Studio sweep every 10 minutes (switch-on gate G2, docs/FILM_STUDIO.md): tools/film_sweep.py calls
# film_sweep('actions') (migration 0212), which runs 0171's film_expire_segments and records that it ran. It is the guaranteed
# schedule: it does not depend on the server, the film worker or pg_cron (not installed on the live project).
#
# It spends nothing. The sweep only settles segments already paid for by an open hold, by 0171's rules (capture what was made,
# release the rest). It calls no provider, claims no segment, starts no take and publishes nothing.
# Harmless until the secrets are set: without SUPABASE_URL + SUPABASE_SERVICE_KEY it exits 0 with a ::warning:: annotation, so the
# run's page says it is not sweeping. Minute 3, 13, 23 ...: off the top of the hour, when GitHub's scheduler starts runs latest.

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

# One pass at a time; a late pass waits for the running one. Two at once would be safe too (the sweep skips locked rows), but
# there is nothing to gain from it.
concurrency:
  group: film-sweep
  cancel-in-progress: false

# Least privilege (BR-S-001): the job token may read the repository and nothing else.
permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never pushes: keeps the job token out of .git/config (BR-S-001).
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install "requests>=2.33.0"

      - name: Film sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python tools/film_sweep.py
