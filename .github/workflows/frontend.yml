name: Frontend

# The Command Center had no CI at all: `tsc`, `next lint` and `vitest` only ever
# ran on someone's laptop, so a type error or a failing derivation reached main
# whenever they forgot. This runs the same three checks the Python suite's
# counterpart runs for the bot.
#
# Scoped by path in both directions: Tests ignores `command-center/**` and this
# one runs on nothing else, so a frontend change never pays for the Python suite
# and a Python change never pays for npm install.

on:
  push:
    # main only — see tests.yml. On a PR branch, `push` and `pull_request` would
    # otherwise both fire on the same SHA and run the identical suite twice.
    branches: [main]
    paths:
      - "command-center/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "command-center/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

# A second push supersedes the first: only the newest commit on a branch is
# worth minutes, and cancelling the older run is what keeps the queue short.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (BR-S-001): nothing in this workflow calls the GitHub API or
# pushes, so the job token can only read the repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: command-center
    env:
      # Nothing here should phone home from CI, and the notice is noise in the log.
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never pushes: keeps the job token out of .git/config (BR-S-001).
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: command-center/package-lock.json

      # `ci` rather than `install`: it installs exactly the lockfile and fails if
      # package.json has drifted from it, which is a thing CI should catch.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Each check runs even when an earlier one failed, so one round reports
      # every problem instead of hiding the tests behind a lint nit.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npx next lint

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npx vitest run

      # Not redundant with the typecheck. A server/client boundary violation, a
      # bad route export, or a `"use client"` module importing something
      # server-only all satisfy `tsc` and fail here — which is a class of
      # breakage that reached main more than once while tsc was clean. Last
      # because it is the slowest, so a faster check still fails fast.
      - name: Build
        if: ${{ !cancelled() }}
        run: npx next build
