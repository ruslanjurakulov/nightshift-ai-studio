name: Diag shapes
on:
  push:
    branches: [claude/shapes-diag]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python3 diag_shapes.py
      - run: python3 -m unittest tests.test_editor_shapes -v 2>&1 | tail -40
